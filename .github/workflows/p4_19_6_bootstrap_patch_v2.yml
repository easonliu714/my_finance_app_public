name: P4.19.6 One-shot Bootstrap Patch v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-v2:
    if: >-
      ${{ github.head_ref == 'p4-19-6-calculator-ime-auto-total' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor == 'easonliu714' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p4-19-6-calculator-ime-auto-total
          fetch-depth: 0

      - name: Apply exact P4.19.6 patch v2
        run: |
          set -euo pipefail
          python3 tool/p4_19_6_bootstrap_patch_v2.py
          rm -- \
            tool/p4_19_6_bootstrap_patch.py \
            tool/p4_19_6_bootstrap_patch_v2.py \
            .github/workflows/p4_19_6_bootstrap_patch.yml \
            .github/workflows/p4_19_6_bootstrap_patch_v2.yml
          git diff --check
          git status --short

      - name: Commit exact patched tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            lib/features/product/product_review_calculator.dart \
            lib/features/product/product_manual_review_card.dart \
            lib/features/invoice/lab/private_cloud_invoice_lab_config.dart \
            test/p4_19_5_product_review_ux_test.dart \
            test/p4_19_6_product_review_ux_hotfix_test.dart \
            test/p4_12_34_1_version_contract_test.dart \
            test/p4_12_38_exact_head_test.dart \
            pubspec.yaml \
            .github/workflows/p4_19_6_signed_canary.yml \
            tool/p4_19_6_bootstrap_patch.py \
            tool/p4_19_6_bootstrap_patch_v2.py \
            .github/workflows/p4_19_6_bootstrap_patch.yml \
            .github/workflows/p4_19_6_bootstrap_patch_v2.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'P4.19.6: suppress calculator IME and unlock explicit auto total'
          git push origin HEAD:p4-19-6-calculator-ime-auto-total
