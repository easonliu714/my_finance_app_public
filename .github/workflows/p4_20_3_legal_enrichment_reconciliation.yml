name: P4.20.3 Legal Enrichment Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tool/p4_20_3_bridge_registration_type_evidence.py'
      - 'tool/p4_20_3_reconcile_legal_enrichment.py'
      - 'tool/p4_20_3_package_legal_enrichment.py'
      - '.github/workflows/p4_20_3_legal_enrichment_reconciliation.yml'

permissions:
  contents: read

concurrency:
  group: p4-20-3-legal-enrichment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile-contract:
    name: Validate fail-closed legal enrichment bridge, reconciler, and deterministic packager
    if: >-
      ${{ github.head_ref == 'p4-20-3-nationwide-official-registry' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor == 'easonliu714' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Frozen ancestor and exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          frozen='a533c9c87131ee487ca2321f3d53e432121c7981'
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          git cat-file -e "$frozen^{commit}"
          git merge-base --is-ancestor "$frozen" HEAD
          printf 'P4.20.2 owner-validated ancestor: PASS (%s)\n' "$frozen"
          printf 'P4.20.3 legal-enrichment exact head: %s\n' "$actual"

      - name: Compile and run focused bridge, reconciliation, and packaging contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tool/p4_20_3_bridge_registration_type_evidence.py \
            tool/p4_20_3_reconcile_legal_enrichment.py \
            tool/p4_20_3_package_legal_enrichment.py
          python3 tool/p4_20_3_bridge_registration_type_evidence.py --self-test
          python3 tool/p4_20_3_reconcile_legal_enrichment.py --self-test
          python3 tool/p4_20_3_package_legal_enrichment.py --self-test
          printf 'P4_20_3_REGISTRATION_TYPE_LEGAL_BRIDGE_CANONICAL_CI=PASS\n'
          printf 'P4_20_3_LEGAL_ENRICHMENT_PACKAGER_CANONICAL_CI=PASS\n'

      - name: Static privacy, pairing, parent-identity, inference, and packaging boundary gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge_path = Path('tool/p4_20_3_bridge_registration_type_evidence.py')
          bridge_text = bridge_path.read_text(encoding='utf-8')
          bridge_required = [
              'validation_subset',
              'official_type_exist_pairing_preserved',
              'parent_child_identity_preserved',
              'branch_parent_identity_required',
              'responsible_person_payload_emitted',
              'merchant_name_inference_used',
              'mobile_per_invoice_network_lookup',
              'EXACT_SELLER_SET_PARITY_MISMATCH',
          ]
          for marker in bridge_required:
              assert marker in bridge_text, marker

          reconcile_path = Path('tool/p4_20_3_reconcile_legal_enrichment.py')
          reconcile_text = reconcile_path.read_text(encoding='utf-8')
          reconcile_required = [
              'responsible_person_payload_emitted',
              'merchant_name_inference_used',
              'gcis_duplicate_semantic_disagreement',
              'gcis_branch_parent_missing',
              'gcis_non_branch_has_parent',
              'RECONCILIATION_PARTITION_MISMATCH',
          ]
          for marker in reconcile_required:
              assert marker in reconcile_text, marker

          package_path = Path('tool/p4_20_3_package_legal_enrichment.py')
          package_text = package_path.read_text(encoding='utf-8')
          package_required = [
              'validation_subset',
              'responsible_person_payload_emitted',
              'merchant_name_inference_used',
              'normal_invoice_per_record_network_lookup',
              'final_mobile_registry',
              'staging_handoff_manifest_sha256',
              'gcis_full_residual_closure_manifest_sha256',
              'gzip-mtime-0',
              'RECONCILIATION_PARTITION_MISMATCH',
          ]
          for marker in package_required:
              assert marker in package_text, marker

          forbidden_output_keys = {
              'responsible_person', 'representative', 'manager',
              '負責人姓名', '代表人姓名', '分公司經理姓名',
          }
          entity_surface = {
              'record_type', 'seller_identifier', 'entity_type', 'legal_name',
              'registration_status', 'parent_seller_identifier', 'source_dataset',
          }
          assert entity_surface.isdisjoint(forbidden_output_keys)
          print('P4_20_3_REGISTRATION_TYPE_PAIRING_BOUNDARY=PASS')
          print('P4_20_3_BRANCH_PARENT_IDENTITY_FAIL_CLOSED=PASS')
          print('P4_20_3_LEGAL_ENRICHMENT_PRIVACY_BOUNDARY=PASS')
          print('P4_20_3_LEGAL_ENRICHMENT_NO_NAME_INFERENCE=PASS')
          print('P4_20_3_LEGAL_ENRICHMENT_PACKAGING_BOUNDARY=PASS')
          PY
