name: Issue13 Cloud500 PDF Diagnostic Lab

on:
  push:
    branches:
      - issue-13-cloud500-pdf-diagnostic-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue13-cloud500-pdf-diagnostic-lab
  cancel-in-progress: true

jobs:
  build-diagnostic-apk:
    name: Build standalone diagnostic APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: L0 source/version/engine/IPC/signer crosswalk (evidence only)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF=refs/heads/issue-13-invoice-award-official-data
          BEFORE="$(git ls-remote origin "$SOURCE_REF" | awk '{print $1}')"
          test -n "$BEFORE"
          git fetch --no-tags origin "+$SOURCE_REF:refs/remotes/origin/issue-13-invoice-award-official-data"
          AFTER="$(git ls-remote origin "$SOURCE_REF" | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          test "$(git rev-parse origin/issue-13-invoice-award-official-data)" = "$AFTER"
          python3 -m unittest discover -s tools -p 'test_issue13_lab_l0_crosswalk.py' -v
          python3 tools/issue13_lab_l0_crosswalk.py \
            --lab-ref HEAD \
            --production-ref origin/issue-13-invoice-award-official-data \
            --output issue13-lab-l0-crosswalk.json
          echo "LAB_L0_PRODUCTION_SOURCE_HEAD=$AFTER" >> "$GITHUB_STEP_SUMMARY"
          echo "LAB_L0_EVIDENCE_ONLY_NOT_INTEGRATION_PASS=TRUE" >> "$GITHUB_STEP_SUMMARY"

      - name: L1 offline official PDF evidence contract (synthetic negatives only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_issue13_lab_l1_official_pdf_audit.py' -v
          python3 -m unittest discover -s tools -p 'test_issue13_lab_l1_batch_audit.py' -v
          python3 -m unittest discover -s tools -p 'test_issue13_lab_l1_batch_chain_audit.py' -v
          echo "LAB_L1_OFFLINE_AUDITOR_CONTRACT=PASS_SYNTHETIC_ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "LAB_L1_OFFICIAL_PDF_BYTES_AND_API35_FULL_PAGE_EXTRACTION=HOLD" >> "$GITHUB_STEP_SUMMARY"
          echo "LAB_L1_GLOBAL_NOT_WIN_AND_PRODUCTION_INTEGRATION=HOLD" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host
        run: flutter create --platforms=android .

      - name: Materialize stable Lab signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/issue13_cloud500_lab_signing/cloud500_lab_signing.p12.b64 > /tmp/cloud500_lab_signing.p12
          keytool -list -v \
            -keystore /tmp/cloud500_lab_signing.p12 \
            -storepass 'cloud500lab-diagnostic-only' \
            -alias cloud500lab | tee /tmp/cloud500_lab_signer.txt
          grep -Fq 'SHA256: 51:C7:FC:93:EF:3D:2A:04:BC:D9:93:E6:E7:16:B3:79:49:EF:DB:74:BE:9A:F7:F4:86:89:CF:C7:FF:5C:3C:53' /tmp/cloud500_lab_signer.txt
          echo 'LAB_STABLE_SIGNING_KEY_GATE=PASS'

      - name: Patch standalone package identity and Android contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace(
              'applicationId = "com.example.my_finance_app"',
              'applicationId = "com.easonliu.cloud500diag"',
          )
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace(
                  'compileOptions {',
                  'compileOptions {\n'
                  '        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in text:
              if 'dependencies {' not in text:
                  text += '\n\ndependencies {\n'
                  text += '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  text += '}\n'
              else:
                  text = text.replace(
                      'dependencies {',
                      'dependencies {\n'
                      '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1,
                  )
          signing = (
              '    signingConfigs {\n'
              '        create("cloud500Lab") {\n'
              '            storeFile = file("/tmp/cloud500_lab_signing.p12")\n'
              '            storePassword = "cloud500lab-diagnostic-only"\n'
              '            keyAlias = "cloud500lab"\n'
              '            keyPassword = "cloud500lab-diagnostic-only"\n'
              '        }\n'
              '    }\n'
          )
          if 'create("cloud500Lab")' not in text:
              text = text.replace('    buildTypes {', signing + '\n    buildTypes {', 1)
              text = text.replace(
                  '    buildTypes {',
                  '    buildTypes {\n'
                  '        getByName("debug") {\n'
                  '            signingConfig = signingConfigs.getByName("cloud500Lab")\n'
                  '        }',
                  1,
              )
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              text = text.replace(marker, marker + '\n    ' + permission, 1)
          text = text.replace(
              'android:label="my_finance_app"',
              'android:label="Cloud500 PDF Lab"',
          )
          # Generated Android host inherits permissions from unused plugins.
          # Remove only Lab-unneeded sensitive permissions, without touching
          # production manifests or the official PDF / durable cursor.
          if text.count(marker) != 1:
              raise SystemExit('LAB_MANIFEST_ROOT_GATE=FAIL')
          text = text.replace(
              marker,
              marker[:-1] + ' xmlns:tools="http://schemas.android.com/tools">',
              1,
          )
          for permission_name in (
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
          ):
              removal = (
                  '    <uses-permission android:name="'
                  + permission_name
                  + '" tools:node="remove" />'
              )
              if '    <application' not in text:
                  raise SystemExit('LAB_MANIFEST_APPLICATION_GATE=FAIL')
              text = text.replace('    <application', removal + '\n    <application', 1)
          for feature_name in (
              'android.hardware.camera',
              'android.hardware.camera.any',
              'android.hardware.microphone',
          ):
              removal = (
                  '    <uses-feature android:name="'
                  + feature_name
                  + '" tools:node="remove" />'
              )
              text = text.replace('    <application', removal + '\n    <application', 1)
          manifest.write_text(text)

          # Launch-contract gate: applicationId may differ from namespace, but
          # the generated relative .MainActivity must resolve to the namespace
          # package that actually exists in MainActivity.kt.
          gradle_text = gradle.read_text()
          if 'applicationId = "com.easonliu.cloud500diag"' not in gradle_text:
              raise SystemExit('LAB_APPLICATION_ID_GATE=FAIL')
          if 'namespace = "com.example.my_finance_app"' not in gradle_text:
              raise SystemExit('LAB_ANDROID_NAMESPACE_GATE=FAIL')

          main_activity = next(
              Path('android/app/src/main/kotlin').rglob('MainActivity.kt'),
              None,
          )
          if main_activity is None:
              raise SystemExit('LAB_MAIN_ACTIVITY_PRESENT_GATE=FAIL')
          main_activity_text = main_activity.read_text()
          if 'package com.example.my_finance_app' not in main_activity_text:
              raise SystemExit(
                  'LAB_MAIN_ACTIVITY_PACKAGE_GATE=FAIL path=' + str(main_activity)
              )
          if 'android:name=".MainActivity"' not in manifest.read_text():
              raise SystemExit('LAB_RELATIVE_ACTIVITY_GATE=FAIL')

          print('LAB_APPLICATION_ID_GATE=PASS')
          print('LAB_ANDROID_NAMESPACE_GATE=PASS')
          print('LAB_MAIN_ACTIVITY_PRESENT_GATE=PASS')
          print('LAB_MAIN_ACTIVITY_PACKAGE_GATE=PASS')
          print('LAB_RELATIVE_ACTIVITY_GATE=PASS')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Lab merged permission contract regressions
        run: python3 -m unittest discover -s test -p 'issue13_lab_permission_gate_test.py' -v

      - name: L1 native source preflight JVM regressions (not official PDF runtime)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('packages/flutter_pdf_text/android/src/main/kotlin/me/movenext/flutter_pdf_text/PlatformPdfProbeService.kt').read_text()
          assert src.index('LabOfficialPdfPreflight.verify(') < src.index('renderer = PdfRenderer(descriptor)'), 'L1_PREFLIGHT_ORDER_FAIL'
          assert src.index('L1_REQUEST_ID_INVALID') < src.index('renderer = PdfRenderer(descriptor)'), 'L1_REQUEST_GUARD_ORDER_FAIL'
          print('L1_PREFLIGHT_BEFORE_RENDERER_SOURCE_GATE=PASS')
          PY
          cd android
          ./gradlew :flutter_pdf_text:testDebugUnitTest --no-daemon --console=plain
          echo 'LAB_L1_NATIVE_PREFLIGHT_JVM_TEST=PASS_SYNTHETIC_ONLY' >> "$GITHUB_STEP_SUMMARY"

      - name: L1 cursor recovery regression (synthetic only)
        run: flutter test test/issue13_lab_l1_cursor_test.dart test/issue13_lab_l1_bounded_run_test.dart test/issue13_lab_l1_dispatch_fence_test.dart test/issue13_lab_l1_evidence_bundle_test.dart test/issue13_lab_search_result_test.dart

      - name: Lab v4 source authority gates
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PackageInfo.fromPlatform()' lib/issue13_cloud500_diag_main.dart
          grep -Fq 'Cloud500 PDF Lab $_runtimeVersion' lib/issue13_cloud500_diag_main.dart
          grep -Fq 'startPlatformPdfProbe' lib/issue13_cloud500_diag_main.dart
          grep -Fq 'android.graphics.pdf.PdfRenderer' packages/flutter_pdf_text/android/src/main/kotlin/me/movenext/flutter_pdf_text/PlatformPdfProbeService.kt
          grep -Fq 'L1_PAGE_TEXT_BUDGET_EXCEEDED' packages/flutter_pdf_text/android/src/main/kotlin/me/movenext/flutter_pdf_text/PlatformPdfProbeService.kt
          grep -Fq 'L1_OFFICIAL_SHA_MISMATCH' packages/flutter_pdf_text/android/src/main/kotlin/me/movenext/flutter_pdf_text/LabOfficialPdfPreflight.kt
          grep -Fq '_exportNextL1Batch' lib/issue13_cloud500_diag_main.dart
          grep -Fq 'android:process=":platform_pdf_probe"' packages/flutter_pdf_text/android/src/main/AndroidManifest.xml
          grep -Fq 'output.fd.sync()' packages/flutter_pdf_text/android/src/main/kotlin/me/movenext/flutter_pdf_text/PlatformPdfProbeService.kt
          echo 'LAB_RUNTIME_VERSION_UI_GATE=PASS'
          echo 'LAB_PLATFORM_PDF_RENDERER_SOURCE_GATE=PASS'
          echo 'LAB_NATIVE_LOG_FSYNC_GATE=PASS'

      - name: Analyze diagnostic entry point
        run: flutter analyze lib/issue13_cloud500_diag_main.dart lib/issue13_lab_l1_evidence_bundle.dart lib/issue13_lab_search_result.dart test/issue13_lab_search_result_test.dart

      - name: Build standalone debug APK
        shell: bash
        run: |
          set -euo pipefail
          LAB_BUILD_NUMBER=$((900000 + GITHUB_RUN_NUMBER))
          echo "LAB_BUILD_NUMBER=$LAB_BUILD_NUMBER" >> "$GITHUB_ENV"
          LAB_HEAD="$(git rev-parse HEAD)"
          flutter build apk --debug \
            -t lib/issue13_cloud500_diag_main.dart \
            --build-name "0.4.${GITHUB_RUN_NUMBER}" \
            --build-number "$LAB_BUILD_NUMBER" \
            --dart-define="LAB_BRANCH=issue-13-cloud500-pdf-diagnostic-lab" \
            --dart-define="LAB_HEAD=$LAB_HEAD" \
            --dart-define="LAB_BACKEND=Android PdfRenderer API35+; PDFium 2.0.1 native crash isolated"

      - name: Verify actual merged APK permissions and hardware filters
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK" > issue13-cloud500-diag-permissions.txt
          "$AAPT" dump badging "$APK" > issue13-cloud500-diag-badging.txt
          python3 tool/issue13_lab_permission_gate.py \
            issue13-cloud500-diag-permissions.txt \
            issue13-cloud500-diag-badging.txt

      - name: Verify stable Lab signer
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee issue13-cloud500-diag.signer.txt
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' issue13-cloud500-diag.signer.txt | tr 'A-F' 'a-f')"
          EXPECTED="51c7fc93ef3d2a04bcd993e6e716b37949efdb74be9af7f48689cfc7ff5c3c53"
          echo "Expected Lab signer SHA256 : $EXPECTED"
          echo "Actual Lab signer SHA256   : $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo 'LAB_STABLE_SIGNER_GATE=PASS'

      - name: Record APK authority
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee issue13-cloud500-diag.apk.sha256
          {
            echo "DIAGNOSTIC_BRANCH=issue-13-cloud500-pdf-diagnostic-lab"
            echo "DIAGNOSTIC_HEAD=$(git rev-parse HEAD)"
            echo "APPLICATION_ID=com.easonliu.cloud500diag"
            echo "LAB_VERSION_NAME=0.4.${GITHUB_RUN_NUMBER}"
            echo "LAB_VERSION_CODE=${LAB_BUILD_NUMBER}"
            echo "LAB_SIGNER_SHA256=51c7fc93ef3d2a04bcd993e6e716b37949efdb74be9af7f48689cfc7ff5c3c53"
            echo "LAB_OVERWRITE_UPDATE_READY=TRUE"
            echo "TARGET_PERIOD=115-07-08"
            echo "EXPECTED_PDF_BYTES=135200798"
            echo "EXPECTED_PDF_SHA256=f50d0dcebc7497c51ce2eea9da9525232e638fdc4103decc6a8e0a1c1dac5571"
            echo "PDFIUMANDROID_VERSION=2.0.1"
            echo "PDFIUMANDROID_OWNER_RESULT=NATIVE_CRASH_REASON_5"
            echo "PLATFORM_PDF_RENDERER_GATE=ENABLED_API35_PLUS"
            echo "PLATFORM_PROBE_PROCESS=:platform_pdf_probe"
            echo "LAB_RUNTIME_VERSION_UI=PACKAGE_INFO_PLUS"
            echo "LAB_HEAD_UI=DART_DEFINE_EXACT_HEAD"
          } | tee issue13-cloud500-diag-authority.txt

      - name: Upload standalone diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: issue13-cloud500-pdf-diagnostic-lab
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            issue13-cloud500-diag.apk.sha256
            issue13-cloud500-diag-authority.txt
            issue13-lab-l0-crosswalk.json
            issue13-cloud500-diag.signer.txt
            issue13-cloud500-diag-permissions.txt
            issue13-cloud500-diag-badging.txt
          if-no-files-found: error
          retention-days: 5
