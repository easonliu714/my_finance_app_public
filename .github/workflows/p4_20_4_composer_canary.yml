name: P4.20.4 Merchant Decision Composer Canary

on:
  push:
    branches:
      - p4-20-4-merchant-decision-composer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-20-4-composer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and regress P4.20.4 composer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: P4.20.4 focused regressions
        run: |
          set -euo pipefail
          flutter test test/p4_20_4_merchant_decision_composer_test.dart
          flutter test test/p4_20_4_merchant_decision_composer_card_test.dart
          flutter test test/p4_20_4_merchant_decision_integration_test.dart
          flutter test test/p4_20_4_merchant_decision_coordinator_test.dart
          flutter test test/p4_20_4_merchant_decision_review_section_test.dart
          flutter test test/p4_20_4_invoice_transaction_handoff_boundary_test.dart
          flutter test test/p4_20_4_registry_validation_foreground_resume_test.dart
          flutter test test/p4_20_3_registry_update_presentation_test.dart
          flutter test test/p4_20_2_invoice_registry_corroboration_widget_test.dart
          flutter test test/p4_20_1_registry_stream_validator_test.dart
          flutter test test/p4_19_11_invoice_input_ux_test.dart

      - name: Full regression suite
        run: |
          set -o pipefail
          flutter test 2>&1 | tee p4_20_4_full_flutter.log

      - name: Upload full regression diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-20-4-full-flutter-${{ github.sha }}
          path: p4_20_4_full_flutter.log
          if-no-files-found: error
          retention-days: 7
