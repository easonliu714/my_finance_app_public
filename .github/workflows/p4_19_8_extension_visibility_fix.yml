name: P4.19.8 extension visibility one-shot fix

on:
  push:
    branches: [p4-19-8-invoice-review-transaction-handoff]
    paths: ['.github/workflows/p4_19_8_extension_visibility_fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p4-19-8-invoice-review-transaction-handoff
          fetch-depth: 0
      - name: Re-export TransactionStore identity extension
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/transaction/transaction_providers.dart')
          text = p.read_text()
          marker = "import 'transaction_store.dart';"
          replacement = marker + "\nexport 'transaction_store.dart';"
          if replacement in text:
              raise SystemExit('already patched')
          if text.count(marker) != 1:
              raise SystemExit('unexpected transaction_store import count')
          p.write_text(text.replace(marker, replacement, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/transaction/transaction_providers.dart
          git commit -m 'fix(p4.19.8): expose store identity lookup to transaction entry'
          git push origin HEAD:p4-19-8-invoice-review-transaction-handoff
