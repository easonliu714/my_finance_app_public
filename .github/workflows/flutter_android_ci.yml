name: Flutter Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_debug_artifact:
        description: 'Upload debug APK artifact. Keep false to save artifact quota.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      enable_private_cloud_invoice_lab:
        description: 'Enable the compile-time-gated private cloud invoice LAB in a manual debug build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build-apk:
    name: Analyze, Test, Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          run_heavy=false
          reason="docs-only change"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_heavy=true
            reason="manual workflow_dispatch"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            git diff --name-only "$base_sha" "$head_sha" > changed_files.txt
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [[ "$before_sha" =~ ^0+$ ]]; then
              run_heavy=true
              reason="initial public-root push"
            else
              git diff --name-only "$before_sha" "$head_sha" > changed_files.txt
            fi
          else
            run_heavy=true
            reason="unknown event"
          fi

          if [[ "$run_heavy" != "true" ]]; then
            echo "Changed files:"
            cat changed_files.txt || true

            if [[ ! -s changed_files.txt ]]; then
              run_heavy=true
              reason="changed file list unavailable"
            else
              grep -Ev '^(docs/|.*\.md$|\.gitignore$)' changed_files.txt \
                > non_docs_changed_files.txt || true
              if [[ -s non_docs_changed_files.txt ]]; then
                run_heavy=true
                reason="non-docs files changed"
              fi
            fi
          fi

          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Heavy Flutter path: $run_heavy ($reason)"

      - name: Docs-only change summary
        if: ${{ steps.changes.outputs.run_heavy != 'true' }}
        run: |
          echo "Docs-only change detected."
          echo "Skipping Flutter setup, analyze, tests, and APK build."
          echo "Reason: ${{ steps.changes.outputs.reason }}"

      - name: Setup Java
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter doctor
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        run: flutter doctor -v

      - name: Ensure Android platform files exist
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        run: flutter create --platforms=android .

      - name: Patch Android permissions and desugaring
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          missing = [permission for permission in permissions if permission not in text]
          if missing:
              text = text.replace(
                  marker,
                  marker + ''.join(f'\n    {permission}' for permission in missing),
                  1,
              )
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()

          def patch_compile_options(source: str) -> str:
              if 'isCoreLibraryDesugaringEnabled = true' in source:
                  return source
              lines = source.splitlines()
              output = []
              i = 0
              patched = False
              while i < len(lines):
                  line = lines[i]
                  output.append(line)
                  if line.strip() == 'compileOptions {':
                      block_start_indent = line[: len(line) - len(line.lstrip())]
                      inner_indent = block_start_indent + '    '
                      i += 1
                      block_lines = []
                      depth = 1
                      while i < len(lines):
                          current = lines[i]
                          stripped = current.strip()
                          if stripped.endswith('{'):
                              depth += stripped.count('{')
                          if stripped == '}':
                              depth -= 1
                              if depth == 0:
                                  if not any(
                                      'isCoreLibraryDesugaringEnabled = true' in item
                                      for item in block_lines
                                  ):
                                      block_lines.append(
                                          inner_indent
                                          + 'isCoreLibraryDesugaringEnabled = true'
                                      )
                                  output.extend(block_lines)
                                  output.append(current)
                                  patched = True
                                  break
                          block_lines.append(current)
                          i += 1
                  i += 1

              if patched:
                  return '\n'.join(output) + ('\n' if source.endswith('\n') else '')

              android_marker = 'android {'
              if android_marker not in source:
                  raise SystemExit('Unable to patch desugaring: android block not found')
              replacement = (
                  'android {\n'
                  '    compileOptions {\n'
                  '        sourceCompatibility = JavaVersion.VERSION_11\n'
                  '        targetCompatibility = JavaVersion.VERSION_11\n'
                  '        isCoreLibraryDesugaringEnabled = true\n'
                  '    }'
              )
              return source.replace(android_marker, replacement, 1)

          text = patch_compile_options(text)

          dependency = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          )
          if dependency not in text:
              marker = 'dependencies {'
              if marker in text:
                  text = text.replace(marker, marker + '\n    ' + dependency, 1)
              else:
                  text += '\n\ndependencies {\n    ' + dependency + '\n}\n'
          gradle.write_text(text)
          PY

      - name: Get dependencies
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        run: flutter pub get

      - name: Analyze Dart code
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        run: flutter analyze

      - name: Focused source custody Flutter contract regressions
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          flutter test \
            test/features/invoice/invoice_award_cloud_lifecycle_contract_test.dart \
            test/features/invoice/invoice_award_cloud_pdfium_successor_routing_contract_test.dart \
            test/issue_13_cloud500_pdfium_successor_contract_test.dart \
            test/issue_13_owner_4_20_14_followup_contract_test.dart \
            2>&1 | tee flutter-test.log

      - name: Run tests
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a flutter-test.log

      - name: Summarize failed test evidence
        if: ${{ failure() && steps.changes.outputs.run_heavy == 'true' }}
        shell: bash
        run: |
          if [[ -f flutter-test.log ]]; then
            {
              echo '## Flutter full-test failure evidence'
              echo
              echo '```text'
              tail -n 200 flutter-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check failed full-test log availability
        if: ${{ failure() && steps.changes.outputs.run_heavy == 'true' }}
        id: failed_test_log
        shell: bash
        run: |
          if [[ -f flutter-test.log ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No flutter-test.log: failure occurred before the test step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failed full-test log
        if: ${{ failure() && steps.changes.outputs.run_heavy == 'true' && steps.failed_test_log.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-full-test-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Build debug APK
        if: >-
          ${{ steps.changes.outputs.run_heavy == 'true' &&
              github.event_name != 'workflow_dispatch' }}
        run: >-
          flutter build apk --debug
          --dart-define=ENABLE_PRIVATE_CLOUD_INVOICE_LAB=false

      - name: Build manual debug APK
        if: >-
          ${{ steps.changes.outputs.run_heavy == 'true' &&
              github.event_name == 'workflow_dispatch' }}
        env:
          ENABLE_PRIVATE_CLOUD_INVOICE_LAB: ${{ inputs.enable_private_cloud_invoice_lab }}
        run: >-
          flutter build apk --debug
          --dart-define=ENABLE_PRIVATE_CLOUD_INVOICE_LAB="$ENABLE_PRIVATE_CLOUD_INVOICE_LAB"

      # Native JVM contract gate: a RED result is a real HOLD, never skipped or masked.
      - name: Android Platform Worker channel, heartbeat, atomic-result, foreground, OS-lock, terminal and source-FD custody native regressions
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :flutter_pdf_text:testDebugUnitTest \
            --tests "me.movenext.flutter_pdf_text.PlatformPdfCandidateWorkerServiceNotificationChannelTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformOpenHeartbeatJoinTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformResultAtomicWriterTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformWorkerStartLeaseTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformResultProcessLeaseTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformResultParentCustodyTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformResultTerminalFenceTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformResultWorkerEpochTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformResultTerminalProvenanceTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformSourceSnapshotCustodyTest" \
            --tests "me.movenext.flutter_pdf_text.PlatformSourceSnapshotOrphanCleanupTest" \
            --no-daemon --stacktrace

      # Compiles an Android API35 two-process RED witness. It does NOT run
      # instrumentation or assert a device PASS; no emulator is provisioned.
      - name: Compile Android API35 two-process lease instrumentation (not executed)
        if: ${{ steps.changes.outputs.run_heavy == 'true' }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :flutter_pdf_text:assembleDebugAndroidTest --no-daemon --stacktrace
          echo "ANDROID_NATIVE_REAL_DEVICE_PROOF_HOLD=1 (compile-only)"

      - name: Record debug APK SHA256
        if: >-
          ${{ steps.changes.outputs.run_heavy == 'true' &&
              ((github.event_name == 'pull_request' && github.event.pull_request.number == 41) ||
               (github.event_name == 'workflow_dispatch' && inputs.upload_debug_artifact == 'true')) }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload debug APK artifact
        if: >-
          ${{ steps.changes.outputs.run_heavy == 'true' &&
              ((github.event_name == 'pull_request' && github.event.pull_request.number == 41) ||
               (github.event_name == 'workflow_dispatch' && inputs.upload_debug_artifact == 'true')) }}
        uses: actions/upload-artifact@v4
        with:
          name: my-finance-app-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 1

  android-api35-two-process-lease:
    name: Android API35 independent-process lease runtime (RED witness)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 45 }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR HEAD (not synthetic merge ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "ANDROID_API35_SOURCE_HEAD=$(git rev-parse HEAD)"
      - name: Enable hardware accelerated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo 'ANDROID_API35_KVM_DEVICE_MISSING' >&2
            exit 60
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host and resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android .
          flutter pub get
      # Actual Android API35 emulator execution. The sidecar-swap negative
      # is expected RED until kernel ownership is repaired; do not mask it.
      - name: Execute Android API35 independent PID/UID lease instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: ./android
          script: |
            # reactivecircus executes this script with /usr/bin/sh (dash), not bash.
            # dash has no pipefail; preserve fail-fast with POSIX-compatible -eu.
            set -eu
            adb shell getprop ro.build.version.sdk
            ./gradlew :flutter_pdf_text:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=me.movenext.flutter_pdf_text.PlatformResultProcessLeaseInstrumentedTest \
              --no-daemon --stacktrace
            test -n "$(find ../build -path '*/androidTest-results/*' -name '*.xml' -print -quit)" || { echo 'ANDROID_API35_JUNIT_XML_MISSING' >&2; exit 61; }
            echo 'ANDROID_API35_TWO_PROCESS_LEASE_TESTS_EXECUTED=PASS'
      - name: Preserve Android API35 native JUnit and device evidence
        if: always()
        shell: bash
        run: |
          mkdir -p android-api35-evidence
          # Bound evidence collection if emulator launch fails before ADB.
          if command -v adb >/dev/null 2>&1 && timeout 8s adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
            (timeout 20s adb -e logcat -d -v threadtime > android-api35-evidence/logcat.txt) || true
            (timeout 10s adb -e shell getprop ro.build.version.sdk > android-api35-evidence/api-level.txt) || true
            (timeout 10s adb -e shell getenforce > android-api35-evidence/selinux-mode.txt) || true
          else
            echo 'ANDROID_API35_ADB_DEVICE_UNAVAILABLE' > android-api35-evidence/device-status.txt
          fi
          find build -path '*/androidTest-results/*' -type f -name '*.xml' -exec cp --parents '{}' android-api35-evidence/ \; 2>/dev/null || true
          find build -path '*/reports/androidTests/*' -type f -exec cp --parents '{}' android-api35-evidence/ \; 2>/dev/null || true
      - name: Upload Android API35 JUnit and logcat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr45-android-api35-lease-${{ github.event.pull_request.head.sha }}
          path: android-api35-evidence/
          if-no-files-found: warn
          retention-days: 7
