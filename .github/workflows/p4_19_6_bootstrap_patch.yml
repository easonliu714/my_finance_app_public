name: P4.19.6 One-shot Bootstrap Patch

on:
  push:
    branches:
      - p4-19-6-calculator-ime-auto-total

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'P4.19.6 bootstrap patch runner' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p4-19-6-calculator-ime-auto-total
          fetch-depth: 0

      - name: Prune stale GitHub Actions caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_REF: refs/heads/p4-19-6-calculator-ime-auto-total
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']
          current_ref = os.environ['CURRENT_REF']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'p4-19-6-cache-pruner',
          }

          def request_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          open_prs = set()
          page = 1
          while True:
              rows = request_json(f'{base}/pulls?state=open&per_page=100&page={page}')
              if not rows:
                  break
              open_prs.update(int(row['number']) for row in rows)
              if len(rows) < 100:
                  break
              page += 1

          caches = []
          page = 1
          while True:
              payload = request_json(f'{base}/actions/caches?per_page=100&page={page}')
              rows = payload.get('actions_caches', [])
              caches.extend(rows)
              if len(rows) < 100:
                  break
              page += 1

          cutoff = datetime.now(timezone.utc) - timedelta(days=14)
          candidates = []
          for cache in caches:
              ref = cache.get('ref') or ''
              if ref in {'refs/heads/main', current_ref}:
                  continue
              reason = None
              match = re.fullmatch(r'refs/pull/(\d+)/merge', ref)
              if match and int(match.group(1)) not in open_prs:
                  reason = 'closed_pr'
              else:
                  last = cache.get('last_accessed_at')
                  if last:
                      accessed = datetime.fromisoformat(last.replace('Z', '+00:00'))
                      if accessed < cutoff:
                          reason = 'stale_14d'
              if reason:
                  candidates.append((cache, reason))

          deleted = 0
          freed = 0
          reasons = {}
          for cache, reason in candidates:
              cache_id = int(cache['id'])
              req = urllib.request.Request(
                  f'{base}/actions/caches/{cache_id}',
                  headers=headers,
                  method='DELETE',
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      if response.status not in (200, 204):
                          raise RuntimeError(response.status)
                  deleted += 1
                  freed += int(cache.get('size_in_bytes') or 0)
                  reasons[reason] = reasons.get(reason, 0) + 1
              except Exception as exc:
                  print(f'CACHE_DELETE_WARN id={cache_id} ref={cache.get("ref")} error={exc}')

          print(f'CACHE_TOTAL_BEFORE={len(caches)}')
          print(f'CACHE_DELETE_CANDIDATES={len(candidates)}')
          print(f'CACHE_DELETED={deleted}')
          print(f'CACHE_FREED_BYTES={freed}')
          print(f'CACHE_DELETE_REASONS={json.dumps(reasons, sort_keys=True)}')
          PY

      - name: Apply exact P4.19.6 patch
        run: |
          set -euo pipefail
          python3 tool/p4_19_6_bootstrap_patch.py
          rm -- tool/p4_19_6_bootstrap_patch.py .github/workflows/p4_19_6_bootstrap_patch.yml
          git diff --check
          git status --short

      - name: Commit exact patched tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            lib/features/product/product_review_calculator.dart \
            lib/features/product/product_manual_review_card.dart \
            lib/features/invoice/lab/private_cloud_invoice_lab_config.dart \
            test/p4_19_5_product_review_ux_test.dart \
            test/p4_19_6_product_review_ux_hotfix_test.dart \
            test/p4_12_34_1_version_contract_test.dart \
            test/p4_12_38_exact_head_test.dart \
            pubspec.yaml \
            .github/workflows/p4_19_6_signed_canary.yml \
            tool/p4_19_6_bootstrap_patch.py \
            .github/workflows/p4_19_6_bootstrap_patch.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'P4.19.6: suppress calculator IME and unlock explicit auto total'
          git push origin HEAD:p4-19-6-calculator-ime-auto-total
