name: P4.20.3 Stronger Authority Cohort

on:
  workflow_run:
    workflows: ['P4.20.3 Legal Enrichment Materialization']
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: p4-20-3-stronger-authority-cohort-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  FROZEN_P4_20_2: a533c9c87131ee487ca2321f3d53e432121c7981
  TARGET_BRANCH: p4-20-3-nationwide-official-registry
  EXACT_HEAD: ${{ github.event.workflow_run.head_sha }}

jobs:
  cohort:
    name: Build exact-head stronger-authority cohorts
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'p4-20-3-nationwide-official-registry' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact-head and frozen-ancestor authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "${{ github.event.workflow_run.head_branch }}" = "$TARGET_BRANCH"
          git cat-file -e "$FROZEN_P4_20_2^{commit}"
          git merge-base --is-ancestor "$FROZEN_P4_20_2" HEAD
          echo "P4_20_3_STRONGER_AUTHORITY_EXACT_HEAD=$EXACT_HEAD"

      - name: Compile and self-test cohort production tool
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tool/p4_20_3_build_stronger_authority_cohort.py
          python3 tool/p4_20_3_build_stronger_authority_cohort.py --self-test

      - name: Download triggering exact-head legal materialization
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: p4-20-3-legal-enrichment-materialization-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/p4_20_3_stronger/materialization

      - name: Validate same-generation bridge authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'p4_20_3_stronger'/'materialization'
          bridge = json.loads((root/'bridge'/'bridge_manifest.json').read_text(encoding='utf-8'))
          package = json.loads((root/'package'/'reconciliation_manifest.json').read_text(encoding='utf-8'))
          hold = root/'bridge'/'hold.ndjson'
          assert package['exact_head'] == os.environ['EXACT_HEAD'], package
          assert package['validation_subset'] is False, package
          assert package['final_mobile_registry'] is False, package
          assert bridge['schema_version'] >= 3, bridge
          assert bridge['validation_subset'] is False, bridge
          assert bridge['parent_child_identity_preserved'] is True, bridge
          assert bridge['branch_without_parent_policy'] == 'HOLD', bridge
          assert bridge['responsible_person_payload_emitted'] is False, bridge
          assert bridge['mobile_per_invoice_network_lookup'] is False, bridge
          assert bridge['published_authority_queue_path'] == 'bridge/hold.ndjson', bridge
          payload = hold.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == bridge['authority_required_payload_sha256'], bridge
          assert digest == bridge['hold_payload_sha256'], bridge
          rows = [json.loads(x) for x in payload.decode('utf-8').splitlines() if x.strip()]
          assert len(rows) == bridge['authority_required_seller_count'] == 5130, bridge
          assert bridge['ambiguous_type_authority_required_count'] == 5108, bridge
          assert bridge['branch_parent_authority_required_count'] == 22, bridge
          assert bridge['unsupported_type_authority_required_count'] == 0, bridge
          sellers = [r['seller_identifier'] for r in rows]
          assert sellers == sorted(sellers), 'AUTHORITY_QUEUE_NOT_SORTED'
          assert len(sellers) == len(set(sellers)), 'AUTHORITY_QUEUE_DUPLICATE_SELLER'
          print('P4_20_3_SAME_GENERATION_BRIDGE_AUTHORITY=PASS')
          print('P4_20_3_AUTHORITY_QUEUE_SHA256=' + digest)
          PY

      - name: Build deterministic stronger-authority cohorts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p4_20_3_stronger"
          python3 tool/p4_20_3_build_stronger_authority_cohort.py \
            "$root/materialization/bridge/hold.ndjson" \
            "$root/materialization/bridge/bridge_manifest.json" \
            "$root/cohort"

      - name: Final cohort integrity and privacy audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'p4_20_3_stronger'/'cohort'
          m = json.loads((root/'stronger_authority_manifest.json').read_text(encoding='utf-8'))
          assert m['validation_subset'] is False, m
          assert m['input_authority_seller_count'] == 5130, m
          assert m['responsible_person_payload_emitted'] is False, m
          assert m['mobile_per_invoice_network_lookup'] is False, m
          assert m['branch_without_parent_policy'] == 'HOLD_UNTIL_AUTHORITATIVE_PARENT', m
          expected = {
              'ambiguous_type_required.ndjson': 5108,
              'branch_parent_required.ndjson': 22,
              'unsupported_type_required.ndjson': 0,
          }
          for name, count in expected.items():
              path = root/name
              payload = path.read_bytes()
              rows = [json.loads(x) for x in payload.decode('utf-8').splitlines() if x.strip()]
              assert len(rows) == count, (name, len(rows), count)
              assert m['outputs'][name]['seller_count'] == count, (name, m)
              assert m['outputs'][name]['payload_sha256'] == hashlib.sha256(payload).hexdigest(), (name, m)
              sellers = [r['seller_identifier'] for r in rows]
              assert sellers == sorted(sellers), name
              assert len(sellers) == len(set(sellers)), name
              text = payload.decode('utf-8').lower()
              assert 'responsible' not in text, name
              assert 'manager' not in text, name
          print('P4_20_3_STRONGER_AUTHORITY_COHORT_INTEGRITY=PASS')
          print(json.dumps(m, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload exact-head stronger-authority cohort evidence
        uses: actions/upload-artifact@v4
        with:
          name: p4-20-3-stronger-authority-cohort-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/p4_20_3_stronger/cohort/stronger_authority_manifest.json
            ${{ runner.temp }}/p4_20_3_stronger/cohort/ambiguous_type_required.ndjson
            ${{ runner.temp }}/p4_20_3_stronger/cohort/branch_parent_required.ndjson
            ${{ runner.temp }}/p4_20_3_stronger/cohort/unsupported_type_required.ndjson
          if-no-files-found: error
          retention-days: 30
