name: P4.17.4 One-shot Controlled Patch

on:
  push:
    branches:
      - p4-17-2-traditional-seller-tax-stability-followup
    paths:
      - '.github/workflows/p4_17_4_one_shot_patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.repository == 'easonliu714/my_finance_app_public' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: p4-17-2-traditional-seller-tax-stability-followup
          fetch-depth: 2

      - name: Verify one-shot parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1b803a42caba8a4d2aa0e331165a465f65c85340"
          test "$(git rev-parse --abbrev-ref HEAD)" = "p4-17-2-traditional-seller-tax-stability-followup"

      - name: Apply P4.17.4 capture-only policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          def replace_between(path_str, start, end, new_middle):
              path = Path(path_str)
              text = path.read_text()
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'{path}: start marker missing')
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f'{path}: end marker missing')
              path.write_text(text[:i] + new_middle + text[j:])

          adaptive = 'lib/features/invoice/invoice_live_capture_adaptive_page.dart'
          overlay = 'lib/features/invoice/invoice_live_adaptive_overlay.dart'

          # ---- New pure 3-of-7 capture-only policy ----
          Path('lib/features/invoice/invoice_seller_tax_capture_policy.dart').write_text(r'''const int sellerTaxCaptureOnlyWindowSize = 7;
          const int sellerTaxCaptureOnlyThreshold = 3;

          class InvoiceSellerTaxCaptureOnlyDecision {
            const InvoiceSellerTaxCaptureOnlyDecision({
              required this.window,
              required this.evidenceCount,
              required this.ready,
            });

            final List<bool> window;
            final int evidenceCount;
            final bool ready;
          }

          InvoiceSellerTaxCaptureOnlyDecision resolveInvoiceSellerTaxCaptureOnly({
            required List<bool> previousWindow,
            required bool currentStructuralEvidence,
            required bool invoiceGreen,
            required bool electronicWideEvidence,
            int windowSize = sellerTaxCaptureOnlyWindowSize,
            int threshold = sellerTaxCaptureOnlyThreshold,
          }) {
            if (windowSize <= 0) {
              throw ArgumentError.value(windowSize, 'windowSize');
            }
            if (threshold <= 0 || threshold > windowSize) {
              throw ArgumentError.value(threshold, 'threshold');
            }

            final next = <bool>[...previousWindow, currentStructuralEvidence];
            final window = next.length <= windowSize
                ? next
                : next.sublist(next.length - windowSize);
            final evidenceCount = window.where((value) => value).length;

            return InvoiceSellerTaxCaptureOnlyDecision(
              window: List<bool>.unmodifiable(window),
              evidenceCount: evidenceCount,
              ready: invoiceGreen &&
                  !electronicWideEvidence &&
                  evidenceCount >= threshold,
            );
          }
          '''.replace('          ', ''))

          # ---- Bounded structural seller-tax evidence: visual/capture only ----
          structural_class = r'''
          /// Non-authoritative seller-tax structure evidence used only to decide
          /// whether a high-resolution still image is worth capturing.
          ///
          /// This evidence never authorizes a seller-tax value. Checksum-valid
          /// seller tax admission remains exclusively in TraditionalSellerTaxIdEvidence.
          class InvoiceSellerTaxStructuralEvidence {
            const InvoiceSellerTaxStructuralEvidence({
              required this.rawText,
              required this.imageRect,
              required this.source,
            });

            final String rawText;
            final Rect imageRect;
            final String source;
          }

          '''.replace('          ', '')
          replace_once(
              overlay,
              'class InvoiceReceiptGeometryObservation {',
              structural_class + 'class InvoiceReceiptGeometryObservation {',
          )

          structural_function = r'''
          InvoiceSellerTaxStructuralEvidence? findSellerTaxStructuralEvidence(
            List<InvoiceOcrVisualLine> lines, {
            required String invoiceNumber,
          }) {
            if (lines.isEmpty) return null;
            final invoiceTarget = _compactAlphaNumeric(invoiceNumber);
            if (invoiceTarget.isEmpty) return null;

            var invoiceIndex = -1;
            for (var index = 0; index < lines.length; index += 1) {
              if (_compactAlphaNumeric(lines[index].text).contains(invoiceTarget)) {
                invoiceIndex = index;
                break;
              }
            }
            if (invoiceIndex < 0) return null;

            final invoiceLine = lines[invoiceIndex];
            final invoiceDigits = invoiceTarget.length >= 8
                ? invoiceTarget.substring(invoiceTarget.length - 8)
                : invoiceTarget;
            final explicitToken = RegExp(
              r'(?:賣方(?:統編|統一編號)?|統編|統一編號)\s*[:：.]?\s*([0-9０-９OIl|BDSZGTE]{7,9})(?![0-9０-９OIl|BDSZGTE])',
              caseSensitive: false,
            );
            final weakLabelToken = RegExp(
              r'^(?:NO|N0|HO|H0)\.?\s*[:：.]?\s*([0-9０-９OIl|BDSZGTE]{7,9})$',
              caseSensitive: false,
            );
            final unlabeledEightDigits = RegExp(r'^[0-9０-９]{8}$');
            final hardBoundary = RegExp(
              r'(?:電話|TEL|PHONE|地址|日期|時間|交易明細|商品明細|消費明細|銷售明細|發票明細|交易內容|品項|項目|總計|合計|小計|現金|收現|找零|隨機碼|訂單|交易編號)',
              caseSensitive: false,
            );

            final end = (invoiceIndex + 8).clamp(0, lines.length);
            for (var index = invoiceIndex + 1; index < end; index += 1) {
              final line = lines[index];
              final raw = line.text.trim();
              if (raw.isEmpty) continue;
              if (hardBoundary.hasMatch(raw)) break;

              String? token;
              String source = '';
              final explicit = explicitToken.firstMatch(raw);
              final weak = weakLabelToken.firstMatch(raw);
              if (explicit != null) {
                token = explicit.group(1);
                source = 'explicit_label_structure';
              } else if (weak != null) {
                token = weak.group(1);
                source = 'weak_label_structure';
              } else if (unlabeledEightDigits.hasMatch(raw)) {
                token = raw;
                source = 'positional_8digit_structure';
              }
              if (token == null || !_isMostlyDigitLikeSellerTaxToken(token)) {
                continue;
              }

              final normalizedCandidate = _normalizedOcrDigits(token);
              if (normalizedCandidate == invoiceDigits) continue;

              final invoiceHeight = invoiceLine.imageRect.height <= 0
                  ? 1.0
                  : invoiceLine.imageRect.height;
              final verticalGap = line.imageRect.top - invoiceLine.imageRect.bottom;
              if (verticalGap < -invoiceHeight * 0.4 ||
                  verticalGap > invoiceHeight * 14) {
                continue;
              }
              final horizontalTolerance =
                  (invoiceLine.imageRect.width + line.imageRect.width)
                      .clamp(1.0, double.infinity);
              if ((line.imageRect.center.dx - invoiceLine.imageRect.center.dx).abs() >
                  horizontalTolerance) {
                continue;
              }

              return InvoiceSellerTaxStructuralEvidence(
                rawText: raw,
                imageRect: line.imageRect,
                source: source,
              );
            }
            return null;
          }

          bool _isMostlyDigitLikeSellerTaxToken(String token) {
            final compact = token.replaceAll(RegExp(r'[\s:：.]'), '');
            if (compact.length < 7 || compact.length > 9) return false;
            final digitLike = RegExp(r'[0-9０-９OIl|]', caseSensitive: false)
                .allMatches(compact)
                .length;
            return digitLike >= 6 && digitLike * 3 >= compact.length * 2;
          }

          '''.replace('          ', '')
          replace_once(
              overlay,
              'InvoiceSellerTaxVisualCandidate? findSellerTaxVisualCandidate(\n',
              structural_function + 'InvoiceSellerTaxVisualCandidate? findSellerTaxVisualCandidate(\n',
          )
          replace_once(
              overlay,
              '''}) {\n  if (lines.isEmpty) return null;\n\n  final explicitLabel = RegExp(''',
              '''}) {\n  if (lines.isEmpty) return null;\n\n  final structural = findSellerTaxStructuralEvidence(\n    lines,\n    invoiceNumber: invoiceNumber,\n  );\n  if (structural != null) {\n    return InvoiceSellerTaxVisualCandidate(\n      rawText: structural.rawText,\n      imageRect: structural.imageRect,\n    );\n  }\n\n  final explicitLabel = RegExp(''',
          )

          # ---- Adaptive Live: preserve Green, add Yellow 3-of-7 capture-only ----
          replace_once(
              adaptive,
              "import 'invoice_qr_parser.dart';\nimport 'invoice_total_evidence.dart';",
              "import 'invoice_qr_parser.dart';\nimport 'invoice_seller_tax_capture_policy.dart';\nimport 'invoice_total_evidence.dart';",
          )
          replace_once(
              adaptive,
              '''  int _captureSequence = 0;\n  String? _error;''',
              '''  int _captureSequence = 0;\n  final List<bool> _sellerTaxStructuralEvidenceWindow = <bool>[];\n  String _sellerTaxStructuralInvoiceNumber = '';\n  int _sellerTaxStructuralEvidenceCount = 0;\n  bool _captureOnlyFreezeReady = false;\n  String? _error;''',
          )
          replace_once(
              adaptive,
              '''      final invoiceVisualRect = parsedText.invoiceNumber?.isNotEmpty == true\n          ? findInvoiceTextEvidenceRect(visualLines, parsedText.invoiceNumber!)\n          : null;\n      final electronicWideEvidence = resolveInvoiceElectronicWideEvidence(''',
              '''      final invoiceVisualRect = parsedText.invoiceNumber?.isNotEmpty == true\n          ? findInvoiceTextEvidenceRect(visualLines, parsedText.invoiceNumber!)\n          : null;\n      var sellerTaxStructuralEvidence = findSellerTaxStructuralEvidence(\n        visualLines,\n        invoiceNumber: invoiceNumber,\n      );\n      var sellerTaxStructuralEvidenceSource =\n          sellerTaxStructuralEvidence?.source ?? '';\n      final electronicWideEvidence = resolveInvoiceElectronicWideEvidence(''',
          )
          replace_once(
              adaptive,
              '''        final latinAccepted = latinTaxEvidence?.acceptedForLive == true;''',
              '''        final latinVisualLines = <InvoiceOcrVisualLine>[\n          for (final line in latinPositionedLines)\n            InvoiceOcrVisualLine(\n              text: line.text,\n              imageRect:\n                  Rect.fromLTRB(line.left, line.top, line.right, line.bottom),\n            ),\n        ];\n        final latinStructuralEvidence = findSellerTaxStructuralEvidence(\n          latinVisualLines,\n          invoiceNumber: invoiceNumber.isNotEmpty\n              ? invoiceNumber\n              : latinParsed.invoiceNumber ?? '',\n        );\n        if (sellerTaxStructuralEvidence == null &&\n            latinStructuralEvidence != null) {\n          sellerTaxStructuralEvidence = latinStructuralEvidence;\n          sellerTaxStructuralEvidenceSource =\n              'latin_${latinStructuralEvidence.source}';\n        }\n        final latinAccepted = latinTaxEvidence?.acceptedForLive == true;''',
          )
          replace_once(
              adaptive,
              '''          sellerTaxVisualLines = <InvoiceOcrVisualLine>[\n            for (final line in latinPositionedLines)\n              InvoiceOcrVisualLine(\n                text: line.text,\n                imageRect:\n                    Rect.fromLTRB(line.left, line.top, line.right, line.bottom),\n              ),\n          ];''',
              '''          sellerTaxVisualLines = latinVisualLines;''',
          )

          old_readiness_tail = '''      _lastSignature = readiness.signature;\n      _stableObservations = readiness.consecutiveObservations;\n\n      final canFreeze = readiness.canFreeze;\n      final effectiveStableObservations = readiness.stableObservations;'''
          new_readiness_tail = '''      _lastSignature = readiness.signature;\n      _stableObservations = readiness.consecutiveObservations;\n\n      final captureInvoice = effectiveInvoiceNumber.trim().toUpperCase();\n      if (electronicWide || captureInvoice.isEmpty) {\n        _sellerTaxStructuralEvidenceWindow.clear();\n        _sellerTaxStructuralInvoiceNumber = '';\n      } else if (_sellerTaxStructuralInvoiceNumber != captureInvoice) {\n        _sellerTaxStructuralEvidenceWindow.clear();\n        _sellerTaxStructuralInvoiceNumber = captureInvoice;\n      }\n      final invoiceGreen = !electronicWide &&\n          invoiceNumber.trim().isNotEmpty &&\n          traditionalConsensus.invoiceNumber == invoiceNumber.trim() &&\n          traditionalConsensus.invoiceObservations >= 2;\n      final currentStructuralEvidence = !electronicWide &&\n          (sellerTaxStructuralEvidence != null ||\n              taxEvidence?.acceptedForLive == true);\n      final captureOnlyDecision = resolveInvoiceSellerTaxCaptureOnly(\n        previousWindow: _sellerTaxStructuralEvidenceWindow,\n        currentStructuralEvidence: currentStructuralEvidence,\n        invoiceGreen: invoiceGreen,\n        electronicWideEvidence: electronicWide,\n      );\n      _sellerTaxStructuralEvidenceWindow\n        ..clear()\n        ..addAll(captureOnlyDecision.window);\n      _sellerTaxStructuralEvidenceCount = captureOnlyDecision.evidenceCount;\n      final captureOnlyCanFreeze =\n          !readiness.canFreeze && captureOnlyDecision.ready;\n      _captureOnlyFreezeReady = captureOnlyCanFreeze;\n      _recordCameraEvent(\n        'SELLER_TAX_CAPTURE_ONLY_WINDOW',\n        details: <String, Object?>{\n          'invoiceGreen': invoiceGreen,\n          'currentStructuralEvidence': currentStructuralEvidence,\n          'evidenceCount': captureOnlyDecision.evidenceCount,\n          'windowSize': sellerTaxCaptureOnlyWindowSize,\n          'threshold': sellerTaxCaptureOnlyThreshold,\n          'captureOnlyReady': captureOnlyCanFreeze,\n          'sellerTaxGreen': readiness.canFreeze,\n          'structuralSource': sellerTaxStructuralEvidenceSource.isNotEmpty\n              ? sellerTaxStructuralEvidenceSource\n              : taxEvidence?.source ?? '',\n          'authoritativeSellerTaxPromoted': false,\n        },\n      );\n\n      final canFreeze = readiness.canFreeze || captureOnlyCanFreeze;\n      final effectiveStableObservations = readiness.stableObservations;'''
          replace_once(adaptive, old_readiness_tail, new_readiness_tail)

          replace_once(
              adaptive,
              '''          canFreeze: canFreeze,\n          stableObservations: effectiveStableObservations,\n        ),''',
              '''          canFreeze: canFreeze,\n          stableObservations: effectiveStableObservations,\n          sellerTaxStructuralEvidenceCount:\n              _sellerTaxStructuralEvidenceCount,\n          captureOnlyFreezeReady: captureOnlyCanFreeze,\n        ),''',
          )

          replace_once(
              adaptive,
              '''      final sellerTaxVisualCandidate = sellerTaxEvidenceRect == null\n          ? findSellerTaxVisualCandidate(\n              visualLines,\n              invoiceNumber: parsedText.invoiceNumber ?? '',\n            )\n          : null;''',
              '''      final sellerTaxStructuralRect = sellerTaxStructuralEvidence?.imageRect;\n      final sellerTaxVisualCandidate = sellerTaxEvidenceRect == null &&\n              sellerTaxStructuralRect == null\n          ? findSellerTaxVisualCandidate(\n              visualLines,\n              invoiceNumber: parsedText.invoiceNumber ?? '',\n            )\n          : null;''',
          )

          replace_once(
              adaptive,
              '''            label: sellerTaxOverlayAccepted ? '賣方統編 ✓' : '統編候選',\n            accepted: sellerTaxOverlayAccepted,\n          )\n        else if (sellerTaxVisualCandidate != null)\n          InvoiceLiveVisualEvidence(\n            kind: InvoiceLiveVisualEvidenceKind.sellerTaxId,\n            imageRect: sellerTaxVisualCandidate.imageRect,\n            label: '統編候選',\n            accepted: false,\n          ),''',
              '''            label: sellerTaxOverlayAccepted\n                ? '賣方統編 ✓'\n                : '賣方統編弱證據 ${math.min(_sellerTaxStructuralEvidenceCount, sellerTaxCaptureOnlyThreshold)}/$sellerTaxCaptureOnlyThreshold',\n            accepted: sellerTaxOverlayAccepted,\n          )\n        else if (sellerTaxStructuralRect != null)\n          InvoiceLiveVisualEvidence(\n            kind: InvoiceLiveVisualEvidenceKind.sellerTaxId,\n            imageRect: sellerTaxStructuralRect,\n            label:\n                '賣方統編弱證據 ${math.min(_sellerTaxStructuralEvidenceCount, sellerTaxCaptureOnlyThreshold)}/$sellerTaxCaptureOnlyThreshold',\n            accepted: false,\n          )\n        else if (sellerTaxVisualCandidate != null)\n          InvoiceLiveVisualEvidence(\n            kind: InvoiceLiveVisualEvidenceKind.sellerTaxId,\n            imageRect: sellerTaxVisualCandidate.imageRect,\n            label: '統編候選',\n            accepted: false,\n          ),''',
          )

          replace_once(
              adaptive,
              '''      if (_autoFreeze && canFreeze && effectiveStableObservations >= 2) {\n        unawaited(_freeze(auto: true));\n      }''',
              '''      if (_autoFreeze && readiness.canFreeze) {\n        unawaited(_freeze(auto: true));\n      } else if (_autoFreeze && captureOnlyCanFreeze) {\n        unawaited(_freeze(auto: true, captureOnly: true));\n      }''',
          )

          # Frozen OCR: when capture-only has no Live authoritative tax, Latin can
          # still recover an independently checksum-valid Frozen value for Review.
          frozen_latin_block = r'''    final expectedSeller = expectedSellerTaxId.trim();
              final chineseExactMatch = expectedSeller.isNotEmpty &&
                  isExactFrozenSellerTaxEvidence(
                    expectedSellerTaxId: expectedSeller,
                    evidence: taxEvidence,
                  );
              final shouldRunLatin = expectedSeller.isNotEmpty
                  ? !chineseExactMatch
                  : frozenSellerTaxId.isEmpty;
              if (shouldRunLatin) {
                final latinInput = mlkit.InputImage.fromFilePath(filePath);
                final latinRecognized = await _latinTextRecognizer.processImage(latinInput);
                final latinPositionedLines = <LocalOcrTextLine>[
                  for (final block in latinRecognized.blocks)
                    for (final line in block.lines)
                      if (line.text.trim().isNotEmpty)
                        LocalOcrTextLine(
                          text: line.text.trim(),
                          left: line.boundingBox.left,
                          top: line.boundingBox.top,
                          right: line.boundingBox.right,
                          bottom: line.boundingBox.bottom,
                        ),
                ];
                final latinLines = latinPositionedLines
                    .map((line) => line.text)
                    .toList(growable: false);
                final latinParsed = _textParser.parse(
                  LocalOcrTextDocument(
                    fullText: latinRecognized.text.trim(),
                    lines: List<String>.unmodifiable(latinLines),
                    positionedLines:
                        List<LocalOcrTextLine>.unmodifiable(latinPositionedLines),
                  ),
                );
                final latinTaxEvidence = extractTraditionalSellerTaxIdEvidence(
                  latinLines,
                  invoiceNumber: frozenInvoiceNumber.isNotEmpty
                      ? frozenInvoiceNumber
                      : latinParsed.invoiceNumber,
                  positionedLines: latinPositionedLines,
                );
                final exactLatinMatch = expectedSeller.isNotEmpty &&
                    isExactFrozenSellerTaxEvidence(
                      expectedSellerTaxId: expectedSeller,
                      evidence: latinTaxEvidence,
                    );
                final latinAcceptedForCaptureOnly = expectedSeller.isEmpty &&
                    latinTaxEvidence?.acceptedForLive == true;
                _recordCameraEvent(
                  'FROZEN_LATIN_SELLER_TAX_FALLBACK',
                  details: <String, Object?>{
                    'expectedSellerTaxId': expectedSeller,
                    'candidate': latinTaxEvidence?.value ?? '',
                    'checksumValid': latinTaxEvidence?.checksumValid,
                    'strongContext': latinTaxEvidence?.strongContext,
                    'acceptedExact': exactLatinMatch,
                    'acceptedForCaptureOnly': latinAcceptedForCaptureOnly,
                    'rawLineCount': latinLines.length,
                    'fullFrameInput': true,
                    'fuzzyGuessingUsed': false,
                  },
                );
                if (frozenInvoiceNumber.isEmpty &&
                    latinParsed.invoiceNumber?.isNotEmpty == true) {
                  frozenInvoiceNumber = latinParsed.invoiceNumber!;
                }
                if (expectedSeller.isNotEmpty) {
                  if (exactLatinMatch) {
                    frozenSellerTaxId = expectedSeller;
                  } else if (frozenSellerTaxId != expectedSeller) {
                    frozenSellerTaxId = '';
                  }
                } else if (latinAcceptedForCaptureOnly && frozenSellerTaxId.isEmpty) {
                  frozenSellerTaxId = latinTaxEvidence!.value;
                }
                rawLineCount = math.max(rawLineCount, latinLines.length);
              }

          '''.replace('              ', '    ')
          replace_between(
              adaptive,
              '    if (expectedSellerTaxId.trim().isNotEmpty &&\n',
              '    return _FrozenIdentityProbe(\n',
              frozen_latin_block,
          )

          replace_once(
              adaptive,
              '  Future<void> _freeze({required bool auto}) async {',
              '  Future<void> _freeze({required bool auto, bool captureOnly = false}) async {',
          )
          replace_once(
              adaptive,
              '''      'auto': auto,\n      'liveInvoiceNumber': _snapshot.invoiceNumber,''',
              '''      'auto': auto,\n      'captureOnly': captureOnly,\n      'liveInvoiceNumber': _snapshot.invoiceNumber,''',
          )
          replace_once(
              adaptive,
              '''      final sellerTaxMatches = !_traditionalExplicitTaxRequired ||\n          (_snapshot.sellerTaxId.isNotEmpty &&\n              frozenProbe.sellerTaxId == _snapshot.sellerTaxId);\n      final accepted = !auto || identityMatches;\n      final finalAccepted = accepted && (!auto || sellerTaxMatches);''',
              '''      final sellerTaxMatches = captureOnly ||\n          !_traditionalExplicitTaxRequired ||\n          (_snapshot.sellerTaxId.isNotEmpty &&\n              frozenProbe.sellerTaxId == _snapshot.sellerTaxId);\n      final accepted = !auto || identityMatches;\n      final finalAccepted = accepted && (!auto || sellerTaxMatches);''',
          )
          replace_once(
              adaptive,
              '''      _recordCameraEvent('FROZEN_IDENTITY_CHECK', details: <String, Object?>{\n        'auto': auto,''',
              '''      _recordCameraEvent('FROZEN_IDENTITY_CHECK', details: <String, Object?>{\n        'auto': auto,\n        'captureOnly': captureOnly,''',
          )
          replace_once(
              adaptive,
              '''        'traditionalExplicitTaxRequired': _traditionalExplicitTaxRequired,\n        'accepted': finalAccepted,''',
              '''        'traditionalExplicitTaxRequired': _traditionalExplicitTaxRequired,\n        'captureOnlySellerTaxMayRemainUnresolved': captureOnly,\n        'frozenSellerTaxRecovered': frozenProbe.sellerTaxId.isNotEmpty,\n        'accepted': finalAccepted,''',
          )

          guidance = r'''  String _guidance({
            required InvoiceLiveClassification classification,
            required String invoiceNumber,
            required String sellerTaxId,
            required bool hasSellerIdentityContext,
            required int qrCount,
            required bool hasValidLeftQr,
            required bool electronicWideEvidence,
            required bool canFreeze,
            required int stableObservations,
            required int sellerTaxStructuralEvidenceCount,
            required bool captureOnlyFreezeReady,
          }) {
            if (captureOnlyFreezeReady) {
              return '發票號碼已綠燈，賣方統編弱證據達 $sellerTaxCaptureOnlyThreshold/$sellerTaxCaptureOnlyThreshold；先凍結高解析影像。黃燈數值不會被當成正式統編，凍結後再由 Local／Gemini／人工覆核。';
            }
            if (canFreeze) {
              return electronicWideEvidence
                  ? '電子發票 evidence 已成立，維持寬版；欄位 identity 已跨 frame 穩定，凍結前仍會鎖定對焦與曝光並驗證 Frozen identity。'
                  : '發票號碼已綠燈，且目前取得 checksum-valid 8 碼賣方統編；立即凍結並再次驗證 identity。';
            }
            if (invoiceNumber.isEmpty) {
              return '預設以寬版尋找電子發票；外框僅供定位，辨識仍使用完整相機畫面。';
            }
            if (electronicWideEvidence) {
              if (classification == InvoiceLiveClassification.electronic &&
                  !hasValidLeftQr) {
                return '已取得電子發票 wide evidence；QR 可作額外高可信證據，但不要求每個 QR 都成功解碼。';
              }
              if (qrCount < 2) {
                return '已取得電子發票 wide evidence，維持寬版取景。';
              }
              return '電子發票證據完整，請保持不動等待欄位 identity 穩定。';
            }
            if (sellerTaxId.isEmpty) {
              if (sellerTaxStructuralEvidenceCount > 0) {
                final progress = sellerTaxStructuralEvidenceCount
                    .clamp(0, sellerTaxCaptureOnlyThreshold);
                return '發票號碼已辨識；賣方統編目前為弱證據 $progress/$sellerTaxCaptureOnlyThreshold。最近 $sellerTaxCaptureOnlyWindowSize 次取樣累積到 $sellerTaxCaptureOnlyThreshold 次後會先凍結影像，但不會採信黃燈數值。';
              }
              return '未符合電子發票 wide evidence，改用細長定位框提示；外框不裁切辨識畫面。等待 checksum-valid 統編，或累積 bounded seller-tax 弱證據後先拍高解析影像。';
            }
            if (!hasSellerIdentityContext) {
              return '已取得 8 碼統編，但商家區仍不穩定；請保持統編與發票號碼清晰。';
            }
            return stableObservations > 0
                ? '發票號碼已穩定，checksum-valid 賣方統編一旦出現即可立即凍結。'
                : '傳統發票候選：細長框僅供定位，完整畫面持續辨識。';
          }

          '''.replace('          ', '')
          replace_between(
              adaptive,
              '  String _guidance({\n',
              '  String _formatDate(DateTime value) {\n',
              guidance,
          )

          replace_once(
              adaptive,
              '''            _TopGuidance(\n              snapshot: _snapshot,\n              error: _error,\n              frameMode: _frameState.mode,\n            ),''',
              '''            _TopGuidance(\n              snapshot: _snapshot,\n              error: _error,\n              frameMode: _frameState.mode,\n              sellerTaxStructuralEvidenceCount:\n                  _sellerTaxStructuralEvidenceCount,\n              captureOnlyFreezeReady: _captureOnlyFreezeReady,\n            ),''',
          )
          replace_once(
              adaptive,
              '''  const _TopGuidance({\n    required this.snapshot,\n    required this.error,\n    required this.frameMode,\n  });\n\n  final InvoiceLiveSnapshot snapshot;\n  final String? error;\n  final InvoiceReceiptFrameMode frameMode;''',
              '''  const _TopGuidance({\n    required this.snapshot,\n    required this.error,\n    required this.frameMode,\n    required this.sellerTaxStructuralEvidenceCount,\n    required this.captureOnlyFreezeReady,\n  });\n\n  final InvoiceLiveSnapshot snapshot;\n  final String? error;\n  final InvoiceReceiptFrameMode frameMode;\n  final int sellerTaxStructuralEvidenceCount;\n  final bool captureOnlyFreezeReady;''',
          )
          replace_once(
              adaptive,
              '''              Text('穩定 ${snapshot.stableObservations}/2'),\n              const Spacer(),''',
              '''              Text('穩定 ${snapshot.stableObservations}/2'),\n              if (snapshot.classification == InvoiceLiveClassification.traditional &&\n                  sellerTaxStructuralEvidenceCount > 0) ...<Widget>[\n                const SizedBox(width: 8),\n                Text(\n                  '統編弱證據 ${math.min(sellerTaxStructuralEvidenceCount, sellerTaxCaptureOnlyThreshold)}/$sellerTaxCaptureOnlyThreshold${captureOnlyFreezeReady ? '・凍結' : ''}',\n                ),\n              ],\n              const Spacer(),''',
          )
          replace_once(
              adaptive,
              '''              '外框僅供定位，辨識永遠使用完整相機畫面；電子發票維持寬框、傳統發票可提示細長框。自動凍結仍保留發票號碼＋8 碼賣方統編、3A lock 與 Frozen identity Gate。',''',
              '''              '外框僅供定位，辨識永遠使用完整相機畫面；Green：發票號碼穩定＋checksum-valid 8 碼統編立即凍結。Yellow：最近 7 次 bounded 統編區弱證據達 3 次時只授權拍照，不採信黃燈數值；Frozen 後仍進人工覆核。',''',
          )

          # ---- Synthetic Public regression coverage ----
          Path('test/p4_17_4_seller_tax_capture_only_policy_test.dart').write_text(r'''import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:my_finance_app/features/invoice/google_mlkit_traditional_invoice_recognizer.dart';
          import 'package:my_finance_app/features/invoice/invoice_live_adaptive_overlay.dart';
          import 'package:my_finance_app/features/invoice/invoice_seller_tax_capture_policy.dart';

          void main() {
            test('3-of-7 non-consecutive structural evidence authorizes capture only', () {
              var window = <bool>[];
              InvoiceSellerTaxCaptureOnlyDecision decision =
                  resolveInvoiceSellerTaxCaptureOnly(
                previousWindow: window,
                currentStructuralEvidence: true,
                invoiceGreen: true,
                electronicWideEvidence: false,
              );
              window = decision.window;
              expect(decision.evidenceCount, 1);
              expect(decision.ready, isFalse);

              for (final value in <bool>[false, true, false, true]) {
                decision = resolveInvoiceSellerTaxCaptureOnly(
                  previousWindow: window,
                  currentStructuralEvidence: value,
                  invoiceGreen: true,
                  electronicWideEvidence: false,
                );
                window = decision.window;
              }
              expect(decision.evidenceCount, 3);
              expect(decision.ready, isTrue);
            });

            test('structural evidence cannot freeze before invoice green', () {
              final decision = resolveInvoiceSellerTaxCaptureOnly(
                previousWindow: const <bool>[true, true],
                currentStructuralEvidence: true,
                invoiceGreen: false,
                electronicWideEvidence: false,
              );
              expect(decision.evidenceCount, 3);
              expect(decision.ready, isFalse);
            });

            test('electronic wide evidence disables Traditional capture-only path', () {
              final decision = resolveInvoiceSellerTaxCaptureOnly(
                previousWindow: const <bool>[true, true],
                currentStructuralEvidence: true,
                invoiceGreen: true,
                electronicWideEvidence: true,
              );
              expect(decision.ready, isFalse);
            });

            test('rolling window evicts evidence older than seven samples', () {
              var window = const <bool>[true, true, true, false, false, false, false];
              final decision = resolveInvoiceSellerTaxCaptureOnly(
                previousWindow: window,
                currentStructuralEvidence: false,
                invoiceGreen: true,
                electronicWideEvidence: false,
              );
              expect(decision.window.length, 7);
              expect(decision.evidenceCount, 2);
              expect(decision.ready, isFalse);
            });

            test('checksum-invalid eight digits below invoice are structural only', () {
              final lines = <InvoiceOcrVisualLine>[
                const InvoiceOcrVisualLine(
                  text: 'ZZ00000001',
                  imageRect: Rect.fromLTRB(100, 100, 300, 120),
                ),
                const InvoiceOcrVisualLine(
                  text: '00000059',
                  imageRect: Rect.fromLTRB(120, 150, 260, 170),
                ),
              ];
              final structural = findSellerTaxStructuralEvidence(
                lines,
                invoiceNumber: 'ZZ00000001',
              );
              expect(structural?.source, 'positional_8digit_structure');

              final authoritative = extractTraditionalSellerTaxIdEvidence(
                const <String>['ZZ00000001', '測試商店', 'N0.00000059'],
              );
              expect(authoritative, isNull);
            });

            test('weak-label 7-9 glyph rows may be structural without value repair', () {
              for (final token in <String>['0B00058', '00B00058', '000B00058']) {
                final structural = findSellerTaxStructuralEvidence(
                  <InvoiceOcrVisualLine>[
                    const InvoiceOcrVisualLine(
                      text: 'ZZ00000001',
                      imageRect: Rect.fromLTRB(100, 100, 300, 120),
                    ),
                    InvoiceOcrVisualLine(
                      text: 'H0.$token',
                      imageRect: const Rect.fromLTRB(120, 150, 280, 170),
                    ),
                  ],
                  invoiceNumber: 'ZZ00000001',
                );
                expect(structural, isNotNull, reason: token);
                expect(structural?.source, 'weak_label_structure', reason: token);
              }
            });

            test('far-away or phone-like number is not structural seller-tax evidence', () {
              final farAway = findSellerTaxStructuralEvidence(
                const <InvoiceOcrVisualLine>[
                  InvoiceOcrVisualLine(
                    text: 'ZZ00000001',
                    imageRect: Rect.fromLTRB(100, 100, 300, 120),
                  ),
                  InvoiceOcrVisualLine(
                    text: '00000059',
                    imageRect: Rect.fromLTRB(120, 500, 260, 520),
                  ),
                ],
                invoiceNumber: 'ZZ00000001',
              );
              final phone = findSellerTaxStructuralEvidence(
                const <InvoiceOcrVisualLine>[
                  InvoiceOcrVisualLine(
                    text: 'ZZ00000001',
                    imageRect: Rect.fromLTRB(100, 100, 300, 120),
                  ),
                  InvoiceOcrVisualLine(
                    text: 'TEL.00000059',
                    imageRect: Rect.fromLTRB(120, 150, 280, 170),
                  ),
                ],
                invoiceNumber: 'ZZ00000001',
              );
              expect(farAway, isNull);
              expect(phone, isNull);
            });

            test('adaptive page keeps Yellow value non-authoritative after capture', () {
              final adaptive = File(
                'lib/features/invoice/invoice_live_capture_adaptive_page.dart',
              ).readAsStringSync();
              expect(adaptive, contains('captureOnly ||'));
              expect(adaptive, contains("'authoritativeSellerTaxPromoted': false"));
              expect(
                adaptive,
                contains("'captureOnlySellerTaxMayRemainUnresolved': captureOnly"),
              );
              expect(adaptive, contains('frozenSellerTaxRecovered'));
            });
          }
          '''.replace('          ', ''))

          # ---- Visible version 4.17.4+426 ----
          version_files = [
              'pubspec.yaml',
              'lib/features/invoice/lab/private_cloud_invoice_lab_config.dart',
              'test/p4_12_34_1_version_contract_test.dart',
              'test/p4_12_38_exact_head_test.dart',
              'test/p4_16_5_live_evidence_contract_test.dart',
              'test/p4_16_production_invoice_integration_contract_test.dart',
          ]
          for file_name in version_files:
              path = Path(file_name)
              text = path.read_text()
              if '4.17.3+425' not in text:
                  raise SystemExit(f'{file_name}: expected 4.17.3+425')
              path.write_text(text.replace('4.17.3+425', '4.17.4+426'))

          workflow = Path('.github/workflows/p4_17_2_signed_canary.yml')
          text = workflow.read_text()
          required = ['P4.17.3', 'p4-17-3', '4.17.3+425', '--build-number=425', "'4.17.3'", "'425'", 'p4_17_3_public_signed_canary']
          for token in required:
              if token not in text:
                  raise SystemExit(f'signed workflow missing expected token: {token}')
          text = text.replace('P4.17.3', 'P4.17.4')
          text = text.replace('p4-17-3', 'p4-17-4')
          text = text.replace('4.17.3+425', '4.17.4+426')
          text = text.replace('--build-number=425', '--build-number=426')
          text = text.replace("'4.17.3'", "'4.17.4'")
          text = text.replace("'425'", "'426'")
          text = text.replace('p4_17_3_public_signed_canary', 'p4_17_4_public_signed_canary')
          test_marker = '          flutter test test/p4_17_2_frozen_seller_tax_exact_match_test.dart\n'
          if test_marker not in text:
              raise SystemExit('signed workflow focused-test marker missing')
          text = text.replace(
              test_marker,
              test_marker + '          flutter test test/p4_17_4_seller_tax_capture_only_policy_test.dart\n',
              1,
          )
          workflow.write_text(text)

          # No stale candidate version may remain in active source/test/workflow contracts.
          stale = []
          for root in [Path('lib'), Path('test'), Path('.github/workflows')]:
              for path in root.rglob('*'):
                  if path.is_file():
                      try:
                          text = path.read_text()
                      except UnicodeDecodeError:
                          continue
                      if '4.17.3+425' in text:
                          stale.append(str(path))
          if '4.17.3+425' in Path('pubspec.yaml').read_text():
              stale.append('pubspec.yaml')
          if stale:
              raise SystemExit('stale 4.17.3+425 remains: ' + ', '.join(stale))
          PY

