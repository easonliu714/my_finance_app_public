name: P4.18.0 Bootstrap

on:
  push:
    branches:
      - p4-18-0-incomplete-local-mandatory-gemini-review
    paths:
      - '.github/workflows/p4_18_0_bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p4-18-0-incomplete-local-mandatory-gemini-review
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply staged product payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          payload = Path('.github/p4_18_0_patch_payload.txt').read_text()
          marker = "          python3 - <<'PY'\n"
          start = payload.index(marker) + len(marker)
          end = payload.index('\n          PY\n', start)
          lines = payload[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )
          exec(compile(script, 'p4_18_0_patch_payload.py', 'exec'))
          PY
          dart format \
            lib/features/invoice/invoice_local_completeness_policy.dart \
            lib/features/invoice/invoice_automatic_recognition_coordinator.dart \
            lib/features/invoice/invoice_review_form_view_model.dart \
            lib/features/invoice/gemini/gemini_invoice_review_coordinator.dart \
            lib/features/invoice/invoice_frozen_review_page.dart \
            test/p4_18_0_local_completeness_policy_test.dart \
            test/p4_18_0_explicit_gemini_upload_boundary_test.dart
          git diff --check
          git config user.name 'easonliu714'
          git config user.email '209346080+easonliu714@users.noreply.github.com'
          git add lib test pubspec.yaml
          git commit -m 'feat: require explicit Gemini review for incomplete Local invoice data'
          git push origin HEAD:p4-18-0-incomplete-local-mandatory-gemini-review
