              if end == -1: raise SystemExit('seller helper end mismatch')
              text = text[:start] + text[end:]
          p.write_text(text)

          # Gemini escalation uses completeness for QR; Traditional keeps warnings/confidence and now merchant completeness.
          p = Path('lib/features/invoice/gemini/gemini_invoice_review_coordinator.dart')
          text = p.read_text()
          text = text.replace("import '../invoice_automatic_recognition_coordinator.dart';", "import '../invoice_automatic_recognition_coordinator.dart';\nimport '../invoice_local_completeness_policy.dart';", 1)
          qr_case = '''      case InvoiceAutomaticRecognitionStatus.qrReviewCandidate:\n        return const GeminiInvoiceEscalationDecision(\n          shouldReview: false,\n          reason: '已有結構化 QR 覆核候選，本階段不自動呼叫 AI。',\n        );'''
          qr_new = '''      case InvoiceAutomaticRecognitionStatus.qrReviewCandidate:\n        final completeness =\n            const InvoiceLocalCompletenessPolicy().evaluate(localResult);\n        return GeminiInvoiceEscalationDecision(\n          shouldReview: completeness.requiresGeminiReview,\n          reason: completeness.reason,\n        );'''
          if text.count(qr_case) != 1: raise SystemExit('gemini qr policy mismatch')
          text = text.replace(qr_case, qr_new, 1)
          text = text.replace("      if (candidate.totalAmount == null) '總金額',\n", "      if (candidate.totalAmount == null) '總金額',\n      if (candidate.sellerName.trim().isEmpty) '商家名稱',\n", 1)
