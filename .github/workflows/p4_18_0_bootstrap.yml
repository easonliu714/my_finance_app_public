name: P4.18.0 Bootstrap

on:
  push:
    branches:
      - p4-18-0-incomplete-local-mandatory-gemini-review
    paths:
      - '.github/workflows/p4_18_0_bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'easonliu714'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p4-18-0-incomplete-local-mandatory-gemini-review
          fetch-depth: 0
      - name: Apply P4.18.0 product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # Visible package/LAB version.
          replace_once('pubspec.yaml', 'version: 4.17.4+426', 'version: 4.18.0+427')
          replace_once('lib/features/invoice/lab/private_cloud_invoice_lab_config.dart', "validationVersion = '4.17.4+426'", "validationVersion = '4.18.0+427'")
          replace_once('test/p4_12_34_1_version_contract_test.dart', 'version: 4.17.4+426', 'version: 4.18.0+427')
          replace_once('test/p4_12_34_1_version_contract_test.dart', "'4.17.4+426'", "'4.18.0+427'")

          # Pure completeness/time policy.
          Path('lib/features/invoice/invoice_local_completeness_policy.dart').write_text(r'''import 'invoice_automatic_recognition_coordinator.dart';

enum InvoiceLocalCompletenessField {
  invoiceNumber,
  invoiceDate,
  invoiceTime,
  sellerTaxId,
  sellerName,
  totalAmount,
}

class InvoiceLocalCompletenessDecision {
  const InvoiceLocalCompletenessDecision({
    required this.requiresGeminiReview,
    required this.missingFields,
    required this.reason,
    required this.isElectronic,
  });

  final bool requiresGeminiReview;
  final List<InvoiceLocalCompletenessField> missingFields;
  final String reason;
  final bool isElectronic;
}

String extractStrictInvoiceTime(String rawText) {
  final normalized = rawText.replaceAll('：', ':');
  final matches = RegExp(r'(?<!\d)([01]\d|2[0-3]):([0-5]\d)(?::([0-5]\d))?(?!\d)')
      .allMatches(normalized)
      .map((match) => match.group(0)!)
      .toSet();
  if (matches.length != 1) return '';
  return matches.single;
}

class InvoiceLocalCompletenessPolicy {
  const InvoiceLocalCompletenessPolicy();

  InvoiceLocalCompletenessDecision evaluate(
    InvoiceAutomaticRecognitionResult result,
  ) {
    if (result.status == InvoiceAutomaticRecognitionStatus.qrReviewCandidate) {
      return _electronic(result);
    }
    if (result.status == InvoiceAutomaticRecognitionStatus.ocrReviewCandidate) {
      return _traditional(result);
    }
    return InvoiceLocalCompletenessDecision(
      requiresGeminiReview:
          result.status != InvoiceAutomaticRecognitionStatus.invalidInput,
      missingFields: const <InvoiceLocalCompletenessField>[],
      reason: result.status == InvoiceAutomaticRecognitionStatus.invalidInput
          ? '本機輸入無效，不應送出影像。'
          : '本機尚未建立完整覆核候選，需要 Gemini 或人工覆核。',
      isElectronic: false,
    );
  }

  InvoiceLocalCompletenessDecision _electronic(
    InvoiceAutomaticRecognitionResult result,
  ) {
    final pairs = result.qrResult?.routingResult?.pairs;
    final parsed = pairs == null || pairs.isEmpty
        ? null
        : pairs.first.left.leftParseResult;
    final supplemental = result.ocrResult?.candidate;
    final rawText = supplemental?.rawText ??
        result.ocrResult?.rawRecognition?.rawText ??
        '';
    final missing = <InvoiceLocalCompletenessField>[
      if ((parsed?.invoiceNumber ?? '').trim().isEmpty)
        InvoiceLocalCompletenessField.invoiceNumber,
      if (parsed?.invoiceDate == null) InvoiceLocalCompletenessField.invoiceDate,
      if (extractStrictInvoiceTime(rawText).isEmpty)
        InvoiceLocalCompletenessField.invoiceTime,
      if ((parsed?.sellerIdentifier ?? '').trim().isEmpty)
        InvoiceLocalCompletenessField.sellerTaxId,
      if ((supplemental?.sellerName ?? '').trim().isEmpty)
        InvoiceLocalCompletenessField.sellerName,
      if (parsed?.totalAmount == null)
        InvoiceLocalCompletenessField.totalAmount,
    ];
    return InvoiceLocalCompletenessDecision(
      requiresGeminiReview: missing.isNotEmpty,
      missingFields: List<InvoiceLocalCompletenessField>.unmodifiable(missing),
      reason: missing.isEmpty
          ? '電子發票 Local 關鍵欄位完整，不需強制 Gemini。'
          : '電子發票 Local 缺少${_labels(missing).join('、')}，需要 Gemini 覆核後由使用者確認。',
      isElectronic: true,
    );
  }

  InvoiceLocalCompletenessDecision _traditional(
    InvoiceAutomaticRecognitionResult result,
  ) {
    final candidate = result.ocrResult?.candidate;
    final missing = <InvoiceLocalCompletenessField>[
      if ((candidate?.invoiceNumber ?? '').trim().isEmpty)
        InvoiceLocalCompletenessField.invoiceNumber,
      if (candidate?.invoiceDate == null) InvoiceLocalCompletenessField.invoiceDate,
      if ((candidate?.sellerTaxId ?? '').trim().isEmpty)
        InvoiceLocalCompletenessField.sellerTaxId,
      if ((candidate?.sellerName ?? '').trim().isEmpty)
        InvoiceLocalCompletenessField.sellerName,
      if (candidate?.totalAmount == null)
        InvoiceLocalCompletenessField.totalAmount,
    ];
    return InvoiceLocalCompletenessDecision(
      requiresGeminiReview: missing.isNotEmpty,
      missingFields: List<InvoiceLocalCompletenessField>.unmodifiable(missing),
      reason: missing.isEmpty
          ? '傳統發票 Local 關鍵欄位完整。'
          : '傳統發票 Local 缺少${_labels(missing).join('、')}，需要 Gemini 或人工覆核。',
      isElectronic: false,
    );
  }

  static List<String> _labels(List<InvoiceLocalCompletenessField> fields) =>
      fields.map((field) => switch (field) {
            InvoiceLocalCompletenessField.invoiceNumber => '發票號碼',
            InvoiceLocalCompletenessField.invoiceDate => '交易日期',
            InvoiceLocalCompletenessField.invoiceTime => '交易時間',
            InvoiceLocalCompletenessField.sellerTaxId => '賣方統編',
            InvoiceLocalCompletenessField.sellerName => '商家名稱',
            InvoiceLocalCompletenessField.totalAmount => '總金額',
          }).toList(growable: false);
}
''')

          # Valid QR remains authoritative but gets one local-only OCR supplemental pass.
          p = Path('lib/features/invoice/invoice_automatic_recognition_coordinator.dart')
          text = p.read_text()
          old_auto = '''      case InvoiceLocalRecognitionStatus.qrCandidate:\n        return InvoiceAutomaticRecognitionResult(\n          status: InvoiceAutomaticRecognitionStatus.qrReviewCandidate,\n          message: qrResult.message,\n          selectedRouteReason: '找到有效電子發票 QR，優先使用 QR 覆核路徑。',\n          requestedRoute: InvoiceRecognitionRequestedRoute.automatic,\n          qrResult: qrResult,\n        );'''
          new_auto = '''      case InvoiceLocalRecognitionStatus.qrCandidate:\n        return _runQrWithSupplementalOcr(\n          validImages: validImages,\n          qrResult: qrResult,\n          requestedRoute: InvoiceRecognitionRequestedRoute.automatic,\n          selectedRouteReason: '找到有效電子發票 QR，QR 維持 identity authority；另執行一次本機 OCR 補充時間與商家欄位。',\n        );'''
          if text.count(old_auto) != 1: raise SystemExit('auto qr block mismatch')
          text = text.replace(old_auto, new_auto, 1)
          old_qr = '''      case InvoiceLocalRecognitionStatus.qrCandidate:\n        return InvoiceAutomaticRecognitionResult(\n          status: InvoiceAutomaticRecognitionStatus.qrReviewCandidate,\n          message: qrResult.message,\n          selectedRouteReason: '使用者改用電子發票 QR 覆核路徑。',\n          requestedRoute:\n              InvoiceRecognitionRequestedRoute.electronicInvoiceQr,\n          qrResult: qrResult,\n        );'''
          new_qr = '''      case InvoiceLocalRecognitionStatus.qrCandidate:\n        return _runQrWithSupplementalOcr(\n          validImages: validImages,\n          qrResult: qrResult,\n          requestedRoute: InvoiceRecognitionRequestedRoute.electronicInvoiceQr,\n          selectedRouteReason: '使用者指定電子發票 QR；QR 維持 identity authority，另執行一次本機 OCR 補充時間與商家欄位。',\n        );'''
          if text.count(old_qr) != 1: raise SystemExit('qr-only block mismatch')
          text = text.replace(old_qr, new_qr, 1)
          marker = '''  Future<InvoiceAutomaticRecognitionResult> _runOcr({'''
          helper = '''  Future<InvoiceAutomaticRecognitionResult> _runQrWithSupplementalOcr({\n    required List<ImageCaptureStagingItem> validImages,\n    required InvoiceLocalRecognitionResult qrResult,\n    required InvoiceRecognitionRequestedRoute requestedRoute,\n    required String selectedRouteReason,\n  }) async {\n    TraditionalInvoiceOcrResult? supplemental;\n    try {\n      supplemental = await ocrRunner(validImages.first.localReference.trim());\n    } catch (_) {\n      supplemental = null;\n    }\n    return InvoiceAutomaticRecognitionResult(\n      status: InvoiceAutomaticRecognitionStatus.qrReviewCandidate,\n      message: supplemental == null\n          ? '${qrResult.message}；本機 OCR 補充失敗，QR 候選仍保留。'\n          : '${qrResult.message}；已完成本機 OCR 補充讀取。',\n      selectedRouteReason: selectedRouteReason,\n      requestedRoute: requestedRoute,\n      qrResult: qrResult,\n      ocrResult: supplemental,\n    );\n  }\n\n'''
          if text.count(marker) != 1: raise SystemExit('ocr marker mismatch')
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text)

          # Review form: explicit time + proper seller-tax field; QR merchant comes only from supplemental OCR.
          p = Path('lib/features/invoice/invoice_review_form_view_model.dart')
          text = p.read_text()
          text = text.replace("import 'invoice_review_handoff_contract.dart';", "import 'invoice_local_completeness_policy.dart';\nimport 'invoice_review_handoff_contract.dart';", 1)
          text = text.replace('  invoiceDate,\n  sellerTaxId,', '  invoiceDate,\n  invoiceTime,\n  sellerTaxId,', 1)
          text = text.replace('''    final parsed = pair?.left.leftParseResult;\n    final fields = <InvoiceReviewFieldViewModel>[\n''', '''    final parsed = pair?.left.leftParseResult;\n    final supplemental = state.automaticResult?.ocrResult?.candidate;\n    final supplementalRawText = supplemental?.rawText ??\n        state.automaticResult?.ocrResult?.rawRecognition?.rawText ??\n        '';\n    final fields = <InvoiceReviewFieldViewModel>[\n''', 1)
          qr_date_end = '''      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.sellerName,\n        label: '\\u5546\\u5bb6',\n        value: _sellerLabel(parsed?.sellerIdentifier),\n        editable: true,\n        requiredForReview: false,\n        confidenceLabel: parsed?.sellerIdentifier == null\n            ? '\\u672a\\u8fa8\\u8b58'\n            : 'QR \\u89e3\\u6790',\n      ),'''
          qr_replacement = '''      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.invoiceTime,\n        label: '交易時間',\n        value: extractStrictInvoiceTime(supplementalRawText),\n        editable: true,\n        requiredForReview: true,\n        confidenceLabel: extractStrictInvoiceTime(supplementalRawText).isEmpty\n            ? '未辨識'\n            : '本機 OCR 補充',\n      ),\n      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.sellerTaxId,\n        label: '賣方統編',\n        value: parsed?.sellerIdentifier?.trim() ?? '',\n        editable: true,\n        requiredForReview: true,\n        confidenceLabel: parsed?.sellerIdentifier == null ? '未辨識' : 'QR 解析',\n      ),\n      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.sellerName,\n        label: '\\u5546\\u5bb6',\n        value: supplemental?.sellerName.trim() ?? '',\n        editable: true,\n        requiredForReview: true,\n        confidenceLabel: supplemental?.sellerName.trim().isNotEmpty == true\n            ? '本機 OCR 補充'\n            : '未辨識',\n      ),'''
          if text.count(qr_date_end) != 1: raise SystemExit('qr seller block mismatch')
          text = text.replace(qr_date_end, qr_replacement, 1)
          ocr_seller = '''      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.sellerName,'''
          ocr_insert = '''      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.invoiceTime,\n        label: '交易時間',\n        value: extractStrictInvoiceTime(candidate?.rawText ?? ''),\n        editable: true,\n        requiredForReview: false,\n        confidenceLabel: extractStrictInvoiceTime(candidate?.rawText ?? '').isEmpty\n            ? '未辨識'\n            : '本機 OCR',\n      ),\n      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.sellerTaxId,\n        label: '賣方統編',\n        value: candidate?.sellerTaxId.trim() ?? '',\n        editable: true,\n        requiredForReview: true,\n        confidenceLabel: _confidenceLabel(\n          candidate?.confidence[TraditionalInvoiceOcrField.sellerTaxId],\n        ),\n        warnings: candidate?.fieldWarnings[\n              TraditionalInvoiceOcrField.sellerTaxId\n            ] ??\n            const <String>[],\n      ),\n'''
          # Second sellerName occurrence is OCR; first QR block was already replaced.
          if text.count(ocr_seller) != 1: raise SystemExit(f'ocr seller marker mismatch {text.count(ocr_seller)}')
          text = text.replace(ocr_seller, ocr_insert + ocr_seller, 1)
          # remove obsolete private helper
          start = text.find('  static String _sellerLabel(')
          if start != -1:
