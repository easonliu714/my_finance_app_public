          p = Path('lib/features/invoice/gemini/gemini_invoice_review_coordinator.dart')
          text = p.read_text().replace("import '../invoice_automatic_recognition_coordinator.dart';", "import '../invoice_automatic_recognition_coordinator.dart';\nimport '../invoice_local_completeness_policy.dart';", 1)
          old = """      case InvoiceAutomaticRecognitionStatus.qrReviewCandidate:\n        return const GeminiInvoiceEscalationDecision(\n          shouldReview: false,\n          reason: '已有結構化 QR 覆核候選，本階段不自動呼叫 AI。',\n        );"""
          new = """      case InvoiceAutomaticRecognitionStatus.qrReviewCandidate:\n        final completeness = const InvoiceLocalCompletenessPolicy().evaluate(localResult);\n        return GeminiInvoiceEscalationDecision(shouldReview: completeness.requiresGeminiReview, reason: completeness.reason);"""
          if text.count(old) != 1: raise SystemExit('gemini qr policy mismatch')
          text = text.replace(old, new, 1)
          text = text.replace("      if (candidate.totalAmount == null) '總金額',\n", "      if (candidate.totalAmount == null) '總金額',\n      if (candidate.sellerName.trim().isEmpty) '商家名稱',\n", 1)
          p.write_text(text)

          p = Path('lib/features/invoice/invoice_frozen_review_page.dart')
          text = p.read_text()
          text = text.replace("  static const Key forceGeminiKey", "  static const Key geminiAcknowledgementKey = Key('invoice_frozen_gemini_ack');\n  static const Key forceGeminiKey", 1)
          text = text.replace('  GeminiInvoiceReviewExecution? _geminiExecution;\n', '  GeminiInvoiceReviewExecution? _geminiExecution;\n  GeminiInvoiceEscalationDecision? _geminiDecision;\n  bool _geminiComparisonAcknowledged = false;\n', 1)
          old = """      setState(() {\n        _localResult = local;\n        _busy = false;\n      });\n      await _runGemini(local, forceReview: false);"""
          new = """      final decision = const GeminiInvoiceEscalationPolicy().evaluate(local.recognitionResult);\n      setState(() { _localResult = local; _geminiDecision = decision; _busy = false; });"""
          if text.count(old) != 1: raise SystemExit('auto Gemini mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('      if (forceReview) _geminiExecution = null;', '      if (forceReview) _geminiExecution = null;\n      _geminiComparisonAcknowledged = false;', 1)
          text = text.replace('先執行本機 QR/OCR；只有欄位缺失、有警告或關鍵信心度不足時才自動 Gemini。強制 Gemini 按鈕永遠保留，AI 不會覆寫 Local。', '先執行本機 QR/OCR。若關鍵欄位不完整，系統會標示 Gemini 必要覆核，但不會自動上傳影像；只有你明確按下按鈕才會送出目前發票影像。AI 不會覆寫 Local。', 1)
          marker = """            const SizedBox(height: 12),\n            _CandidateCard(\n              title: 'Gemini 第二意見',"""
          repl = """            const SizedBox(height: 12),\n            if (_geminiDecision != null) Card(child: ListTile(leading: Icon(_geminiDecision!.shouldReview ? Icons.warning_amber_rounded : Icons.verified_outlined), title: Text(_geminiDecision!.shouldReview ? 'Gemini 必要覆核' : 'Local 關鍵欄位完整'), subtitle: Text('${_geminiDecision!.reason}\\n按下 Gemini 按鈕才會將目前發票影像送出。'))),\n            const SizedBox(height: 12),\n            _CandidateCard(\n              title: 'Gemini 第二意見',"""
