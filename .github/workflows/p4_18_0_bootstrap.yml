          text = text.replace('  static const Key forceGeminiKey', "  static const Key geminiAcknowledgementKey = Key('invoice_frozen_gemini_ack');\n  static const Key forceGeminiKey", 1)
          text = text.replace('  GeminiInvoiceReviewExecution? _geminiExecution;\n', '  GeminiInvoiceReviewExecution? _geminiExecution;\n  GeminiInvoiceEscalationDecision? _geminiDecision;\n  bool _geminiComparisonAcknowledged = false;\n', 1)
          old_run = '''      setState(() {\n        _localResult = local;\n        _busy = false;\n      });\n      await _runGemini(local, forceReview: false);'''
