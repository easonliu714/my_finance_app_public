          p = Path('lib/features/invoice/invoice_review_form_view_model.dart')
          text = p.read_text()
          text = text.replace("import 'invoice_review_handoff_contract.dart';", "import 'invoice_local_completeness_policy.dart';\nimport 'invoice_review_handoff_contract.dart';", 1)
          text = text.replace('  invoiceDate,\n  sellerTaxId,', '  invoiceDate,\n  invoiceTime,\n  sellerTaxId,', 1)
          text = text.replace("    final parsed = pair?.left.leftParseResult;\n    final fields", "    final parsed = pair?.left.leftParseResult;\n    final supplemental = state.automaticResult?.ocrResult?.candidate;\n    final supplementalRawText = supplemental?.rawText ?? state.automaticResult?.ocrResult?.rawRecognition?.rawText ?? '';\n    final fields", 1)
          old = """      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.sellerName,\n        label: '\\u5546\\u5bb6',\n        value: _sellerLabel(parsed?.sellerIdentifier),\n        editable: true,\n        requiredForReview: false,\n        confidenceLabel: parsed?.sellerIdentifier == null\n            ? '\\u672a\\u8fa8\\u8b58'\n            : 'QR \\u89e3\\u6790',\n      ),"""
          new = """      InvoiceReviewFieldViewModel(key: InvoiceReviewFieldKey.invoiceTime, label: '交易時間', value: extractStrictInvoiceTime(supplementalRawText), editable: true, requiredForReview: true, confidenceLabel: extractStrictInvoiceTime(supplementalRawText).isEmpty ? '未辨識' : '本機 OCR 補充'),\n      InvoiceReviewFieldViewModel(key: InvoiceReviewFieldKey.sellerTaxId, label: '賣方統編', value: parsed?.sellerIdentifier?.trim() ?? '', editable: true, requiredForReview: true, confidenceLabel: parsed?.sellerIdentifier == null ? '未辨識' : 'QR 解析'),\n      InvoiceReviewFieldViewModel(key: InvoiceReviewFieldKey.sellerName, label: '\\u5546\\u5bb6', value: supplemental?.sellerName.trim() ?? '', editable: true, requiredForReview: true, confidenceLabel: supplemental?.sellerName.trim().isNotEmpty == true ? '本機 OCR 補充' : '未辨識'),"""
          if text.count(old) != 1: raise SystemExit('qr seller block mismatch')
          text = text.replace(old, new, 1)
          marker = "      InvoiceReviewFieldViewModel(\n        key: InvoiceReviewFieldKey.sellerName,"
          insert = """      InvoiceReviewFieldViewModel(key: InvoiceReviewFieldKey.invoiceTime, label: '交易時間', value: extractStrictInvoiceTime(candidate?.rawText ?? ''), editable: true, requiredForReview: false, confidenceLabel: extractStrictInvoiceTime(candidate?.rawText ?? '').isEmpty ? '未辨識' : '本機 OCR'),\n      InvoiceReviewFieldViewModel(key: InvoiceReviewFieldKey.sellerTaxId, label: '賣方統編', value: candidate?.sellerTaxId.trim() ?? '', editable: true, requiredForReview: true, confidenceLabel: _confidenceLabel(candidate?.confidence[TraditionalInvoiceOcrField.sellerTaxId]), warnings: candidate?.fieldWarnings[TraditionalInvoiceOcrField.sellerTaxId] ?? const <String>[]),\n"""
          if text.count(marker) != 1: raise SystemExit('ocr seller marker mismatch')
          text = text.replace(marker, insert + marker, 1)
