name: my_finance_app
description: Local-first personal finance app for Taiwan daily accounting.
publish_to: 'none'
version: 4.19.2+439

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.9
  camera: ^0.12.0+1
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  flutter_inappwebview: 6.2.0-beta.3
  flutter_local_notifications: 19.5.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  go_router: ^14.2.7
  google_mlkit_barcode_scanning: ^0.14.2
  google_mlkit_commons: ^0.11.1
  google_mlkit_text_recognition: ^0.15.1
  http: ^1.6.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_chinese_text_model:
    path: packages/local_chinese_text_model
  mobile_scanner: ^7.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  shared_preferences: ^2.5.4
  sqflite: ^2.4.2
  timezone: ^0.10.0
  uuid: ^4.5.1
  webview_flutter: 4.13.1
  wakelock_plus: 1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: 2.3.7
