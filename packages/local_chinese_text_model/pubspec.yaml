version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.easonliu.myfinance.local_chinese_text_model
        pluginClass: LocalChineseTextModelPlugin
